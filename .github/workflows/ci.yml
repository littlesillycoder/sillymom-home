name: CI

on:
  pull_request:
  push:
    branches: [main]

# GitHub Actions 一律指定到提交編號（#103）：就算對方的版本標籤被改指到別的程式，也不受影響。
# Dependabot 會自動提出更新（註解裡的版本號一起改）。
permissions:
  contents: read

jobs:
  check:
    name: lint、格式、型別、測試、建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db-test:
    name: 資料庫測試（暫時資料庫）
    runs-on: ubuntu-latest
    env:
      # 在這裡一定要有測試資料庫，缺少就讓測試失敗，而不是略過。
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: 產生這次用的簡訊 Hook 密鑰（#11，不寫在檔案裡）
        run: |
          secret="v1,whsec_$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "SUPABASE_AUTH_SEND_SMS_HOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: 開暫時資料庫並套用 migration
        run: pnpm exec supabase start
      - name: 設定測試用連線
        run: pnpm exec supabase status -o json | node scripts/ci/supabase-test-env.mjs >> "$GITHUB_ENV"
      - name: 產生資料庫型別（只用 migration，在建立測試資料表之前）
        run: pnpm exec supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
      - name: 建立測試專用的資料表和函式（不在 migrations，不會推到雲端）
        run: |
          for f in tests/fixtures/sql/*.sql; do
            psql "$SUPABASE_TEST_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: 資料庫測試（一次跑一個檔案，避免互相干擾）
        run: pnpm exec vitest run tests/db/ --no-file-parallelism
      - name: Supabase Auth 次數限制實測（會用掉同一個 IP 的次數，最後才跑）
        run: pnpm exec vitest run tests/db-limits/
      - name: 檢查型別和資料庫一致（不一致請下載 database-types，換掉 src/shared/supabase/database.types.ts）
        run: diff -u src/shared/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-types
          path: ${{ runner.temp }}/database.types.ts
      - if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: 版面自動檢查（Playwright，11 種寬度）
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: 下載測試用瀏覽器（只在 GitHub Actions）
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
