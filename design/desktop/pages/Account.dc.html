<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 帳號設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 10-31：電腦版夠寬，詞不從中間斷開（在標點、空白處換行）；「·」跟著前面的字 */
body{word-break:keep-all;overflow-wrap:break-word}
p{word-break:normal}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 1001px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<div style="display: flex; align-items: center; gap: 56px">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<nav style="display: flex; gap: 36px; font-size: 18px"><a href="Dashboard.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">首頁</a><a href="TechList.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">找師傅</a><a href="Records.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">維修紀錄</a><a href="Safety.dc.html" aria-current="page" style="color: #23262E; text-decoration: none; font-weight: 700; padding-bottom: 6px; border-bottom: 3px solid {{accent}}">我的家</a></nav>
</div>
<div style="display: flex; align-items: center; gap: 16px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a>

<a href="Messages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">林</span><span style="font-size: 16px; font-weight: 500">林小姐</span></a>
</div>
</header>
<div style="padding: 40px 80px 0; display: flex; flex-direction: column; gap: 8px"><a href="Safety.dc.html" style="font-size: 16px; text-decoration: none">← 回我的家與安全設定</a><h1 style="margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">帳號設定</h1></div>
<div style="flex-grow: 1; padding: 28px 80px 64px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 24px">
<section style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 14px"><h2 style="margin: 0; font-size: 20px; font-weight: 900; color: {{denim}}">基本資料</h2>
<div style="padding: 16px 18px; border-radius: 14px; background: #F6F3EC; display: flex; align-items: center; justify-content: space-between; gap: 16px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">手機號碼</span><span style="font-size: 16px; color: #245443">+886 [手機號碼] · 已驗證</span></span><a href="SignUp.dc.html" style="font-size: 16px">更換（需簡訊驗證）</a></div>
<div style="padding: 16px 18px; border-radius: 14px; background: #F6F3EC; display: flex; align-items: center; justify-content: space-between; gap: 16px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">師傅怎麼稱呼你</span><span style="font-size: 16px; color: #4E525C">林小姐</span></span><a href="#" style="font-size: 16px">修改</a></div>
<div style="padding: 16px 18px; border-radius: 14px; background: #F6F3EC; display: flex; align-items: center; justify-content: space-between; gap: 16px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">電子發票載具</span><span style="font-size: 16px; color: #4E525C">手機條碼 /ABC1234</span></span><a href="#" style="font-size: 16px">修改</a></div>
</section>
<section style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 14px"><h2 style="margin: 0; font-size: 20px; font-weight: 900; color: {{denim}}">通知方式</h2>
<sc-for list="{{notify}}" as="n" hint-placeholder-count="2">
<button type="button" role="switch" aria-checked="{{n.checked}}" onClick="{{n.pick}}" style="padding: 16px 18px; border-radius: 14px; background: #F6F3EC; display: flex; align-items: center; justify-content: space-between; gap: 16px; border: none; font-family: inherit; color: #23262E; text-align: left; width: 100%">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{n.t}}</span><span style="font-size: 16px; color: #4E525C">{{n.b}}</span></span>
<span style="flex-shrink: 0; width: 46px; height: 28px; box-sizing: border-box; border-radius: 14px; padding: 3px; background: {{n.bg}}; display: flex; justify-content: {{n.align}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
</sc-for>
<span style="font-size: 16px; color: #62666F">預約提醒和取消通知一定會送出，不能全部關閉。</span>
</section>
</div>
<div style="display: flex; flex-direction: column; gap: 24px">
<section style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 14px"><h2 style="margin: 0; font-size: 20px; font-weight: 900; color: {{denim}}">我的資料</h2>
<div style="padding: 16px 18px; border-radius: 14px; background: #F6F3EC; display: flex; align-items: center; justify-content: space-between; gap: 16px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">下載我的資料</span><span style="font-size: 16px; color: #4E525C">維修紀錄、診斷單、評價與付款紀錄</span></span><a href="#" style="font-size: 16px">申請下載</a></div>
<div style="padding: 16px 18px; border-radius: 14px; background: #F6F3EC; display: flex; align-items: center; justify-content: space-between; gap: 16px"><span style="font-size: 16px; font-weight: 700">登出這個裝置</span><a href="Main.dc.html" style="font-size: 16px">登出</a></div>
</section>
<section style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; border: 1.5px solid #B42318; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 900; color: #B42318">刪除帳號</h2>
<sc-for list="{{del}}" as="d" hint-placeholder-count="4"><div style="display: flex; gap: 8px; font-size: 16px; line-height: 1.6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>{{d}}</span></div></sc-for>
<button type="button" style="align-self: flex-start; min-height: 48px; padding: 0 20px; border-radius: 12px; border: none; background: #B42318; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">刪除我的帳號</button>
</section>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":1001}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { n: [true, true] }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const items = [{ t: 'LINE 通知', b: '已綁定 · 預約提醒、師傅回覆、行程通知' }, { t: '簡訊', b: '沒綁 LINE 時改用簡訊；重要通知 LINE 和簡訊都發' }];
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      notify: items.map((it, i) => { const v = this.state.n[i]; return Object.assign({}, it, { checked: v ? 'true' : 'false', bg: v ? denim : '#B9B3A6', align: v ? 'flex-end' : 'flex-start', pick: () => { const n = this.state.n.slice(); n[i] = !n[i]; this.setState({ n: n }); } }); }),
      del: ['有進行中的預約或申訴時，要先完成或取消才能刪除', '錄影、照片、地址和緊急聯絡人會刪除', '依法需要保存的交易與發票紀錄，會保留 [N] 年後刪除', '刪除後無法復原；違規紀錄會保留，用同一支手機重新註冊時會一併查看']
    };
  }
}
</script>
</body>
</html>
