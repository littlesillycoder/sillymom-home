<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 管理後台</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">

<div style="flex-grow: 1; display: flex; min-height: 0">
<nav aria-label="管理後台" style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 24px 16px; background: #23262E; display: flex; flex-direction: column; gap: 6px">
<a href="AdminHome.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; text-decoration: none; color: #FFFFFF"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 900">傻媽萬事通</span><span style="font-size: 13px; color: #A8ABB3">管理後台</span></span></a>
<a href="AdminHome.dc.html" aria-current="page" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #FFFFFF; background: #3A3E48; font-weight: 700">後台首頁</a><a href="AdminTechReview.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">師傅審核<span style="padding: 1px 8px; border-radius: 999px; background: #C8412C; color: #FFFFFF; font-size: 14px; font-weight: 700">5</span></a><a href="AdminDisputes.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">申訴處理<span style="padding: 1px 8px; border-radius: 999px; background: #C8412C; color: #FFFFFF; font-size: 14px; font-weight: 700">3</span></a><a href="AdminMembers.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">會員管理</a><a href="AdminFinance.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">案件與帳務</a><a href="AdminSettings.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">平台設定</a>
<div style="margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #3A3E48; font-size: 13px; color: #A8ABB3">[管理員名稱] · 審核員<br>所有操作都會留下紀錄</div>
</nav>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 28px 36px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px"><div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 24px; font-weight: 900; color: #23262E">今天要處理的事</h1><span style="font-size: 16px; color: #62666F">[日期] · 需要人工處理的項目都在這裡</span></div></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4"><div style="padding: 24px 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 16px; color: #62666F">{{k.t}}</span><span style="font-size: 24px; font-weight: 900; color: {{k.fg}}">{{k.v}}</span><span style="font-size: 13px; color: #62666F">{{k.b}}</span></div></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="padding: 24px 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 18px; font-weight: 900">{{g.t}} <span style="color: {{g.fg}}">{{g.n}}</span></h2><a href="{{g.href}}" style="font-size: 16px">全部 →</a></div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<a href="{{g.href}}" style="padding: 12px 14px; border-radius: 12px; background: #F6F3EC; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: #23262E"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{r.t}}</span><span style="font-size: 13px; color: #62666F">{{r.b}}</span></span><span style="padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: {{r.bg}}; color: {{r.fg}}">{{r.tag}}</span></a>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const red = { bg: '#F8DCD4', fg: '#8E2E1F' }; const gray = { bg: '#EEEAE1', fg: '#4E525C' }; const amber = { bg: '#FDF3D7', fg: '#6B4A00' };
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      kpis: [
        { t: '今天的案件', v: '[N]', b: '視訊 [N] · 到府 [N]', fg: '#23262E' },
        { t: '今天的平台收入', v: 'NT$[N]', b: '退款 NT$[N]', fg: '#23262E' },
        { t: '待審核師傅', v: '5', b: '最久等了 [N] 天', fg: '#B42318' },
        { t: '待處理申訴', v: '3', b: '1 件剩不到 12 小時回覆', fg: '#B42318' }
      ],
      groups: [
        { t: '待審核師傅', n: '5', fg: '#B42318', href: 'AdminTechReview.dc.html', rows: [Object.assign({ t: '周師傅 · 冷氣', b: '送出於 [日期] · 資料齊全', tag: '待審核' }, gray), Object.assign({ t: '吳師傅 · 水電', b: '補件已上傳 · 良民證', tag: '補件回覆' }, amber), Object.assign({ t: '李師傅 · 門鎖', b: '送出於 [日期]', tag: '待審核' }, gray)] },
        { t: '待處理申訴', n: '3', fg: '#B42318', href: 'AdminDisputes.dc.html', rows: [Object.assign({ t: '言行讓我不舒服 · 王師傅', b: '林** · [日期] · 到府', tag: '剩 6 小時回覆' }, red), Object.assign({ t: '收費和報價不符 · 黃師傅', b: '陳** · [日期] · 到府', tag: '協商中' }, amber), Object.assign({ t: '視訊中要求加 LINE · 張師傅', b: '王** · [日期] · 視訊', tag: '剩 52 小時回覆' }, amber)] },
        { t: '良民證 30 天內到期', n: '4', fg: '#6B4A00', href: 'AdminMembers.dc.html', rows: [Object.assign({ t: '林師傅', b: '[日期] 到期 · 已提醒 2 次', tag: '剩 [N] 天' }, amber), Object.assign({ t: '陳師傅', b: '[日期] 到期 · 已上傳新證明，待審核', tag: '待審核' }, gray), Object.assign({ t: '黃師傅', b: '已逾期 · 已移除良民證標章', tag: '已移除標章' }, gray)] },
        { t: '扣款失敗', n: '2', fg: '#B42318', href: 'AdminFinance.dc.html', rows: [Object.assign({ t: '平台服務費 · 周師傅', b: '[日期] · 卡片過期', tag: '待重新扣款' }, red), Object.assign({ t: '客戶平台費（求助） · 林**', b: '[日期] · 餘額不足', tag: '已通知' }, amber)] }
      ]
    };
  }
}
</script>
</body>
</html>
