<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 師傅審核</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 1340px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">

<div style="flex-grow: 1; display: flex; min-height: 0">
<nav aria-label="管理後台" style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 24px 16px; background: #23262E; display: flex; flex-direction: column; gap: 6px">
<a href="AdminHome.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; text-decoration: none; color: #FFFFFF"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 900">傻媽萬事通</span><span style="font-size: 13px; color: #A8ABB3">管理後台</span></span></a>
<a href="AdminHome.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">後台首頁</a><a href="AdminTechReview.dc.html" aria-current="page" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #FFFFFF; background: #3A3E48; font-weight: 700">師傅審核<span style="padding: 1px 8px; border-radius: 999px; background: #C8412C; color: #FFFFFF; font-size: 14px; font-weight: 700">5</span></a><a href="AdminDisputes.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">申訴處理<span style="padding: 1px 8px; border-radius: 999px; background: #C8412C; color: #FFFFFF; font-size: 14px; font-weight: 700">3</span></a><a href="AdminMembers.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">會員管理</a><a href="AdminFinance.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">案件與帳務</a><a href="AdminSettings.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; font-size: 16px; color: #C9CCD3; background: transparent; font-weight: 400">平台設定</a>
<div style="margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #3A3E48; font-size: 13px; color: #A8ABB3">[管理員名稱] · 審核員<br>所有操作都會留下紀錄</div>
</nav>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 28px 36px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px"><div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 24px; font-weight: 900; color: #23262E">師傅審核</h1><span style="font-size: 16px; color: #62666F">看文件、勾檢查項目，再送出結果。補件或不通過的原因會傳給師傅。</span></div></div>
<div style="display: flex; gap: 8px"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: {{t.border}}; background: {{t.bg}}; color: #23262E; font-family: inherit; font-size: 14px; font-weight: {{t.weight}}">{{t.t}}</button></sc-for></div>
<div style="display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start">
<div style="padding: 24px 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 12px; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{apps}}" as="a" hint-placeholder-count="5"><button type="button" aria-pressed="{{a.pressed}}" onClick="{{a.pick}}" style="padding: 12px; border-radius: 12px; border: none; background: {{a.bg}}; font-family: inherit; color: #23262E; text-align: left; display: flex; flex-direction: column; gap: 4px"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 16px; font-weight: 700">{{a.n}}</span><span style="padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: {{a.tagBg}}; color: {{a.tagFg}}">{{a.tag}}</span></span><span style="font-size: 13px; color: #62666F">{{a.b}}</span></button></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<section style="padding: 24px 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900">{{cur.i}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 900">{{cur.n}}</span><span style="font-size: 16px; color: #62666F">{{cur.b}}</span></span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; font-size: 16px">
<sc-for list="{{info}}" as="f" hint-placeholder-count="4"><div style="padding: 10px 12px; border-radius: 10px; background: #F6F3EC; display: flex; flex-direction: column; gap: 2px"><span style="color: #62666F; font-size: 13px">{{f.k}}</span><span style="font-weight: 700">{{f.v}}</span></div></sc-for>
</div>
</section>
<section style="padding: 24px 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 900">文件</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{docs}}" as="d" hint-placeholder-count="6"><div style="padding: 12px; border-radius: 12px; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 8px"><div style="height: 90px; border-radius: 8px; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 13px">{{d.ph}}</div><span style="font-size: 16px; font-weight: 700">{{d.t}}</span><span style="font-size: 13px; color: {{d.fg}}">{{d.note}}</span></div></sc-for>
</div>
</section>
<section style="padding: 24px 28px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 900">審核檢查</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="6"><label style="display: flex; align-items: center; gap: 10px; font-size: 16px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: {{denim}}">{{c}}</label></sc-for>
</div>
<div style="display: flex; gap: 8px"><sc-for list="{{decisions}}" as="t" hint-placeholder-count="3"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: {{t.border}}; background: {{t.bg}}; color: #23262E; font-family: inherit; font-size: 14px; font-weight: {{t.weight}}">{{t.t}}</button></sc-for></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 700">原因（補件或不通過時會傳給師傅）<textarea rows="2" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; padding: 10px 12px; resize: none; font-weight: 400">[例如：良民證照片看不清楚，請重新上傳]</textarea></label>
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #62666F">審核紀錄：[日期] 系統收件 · [日期] [審核員] 開啟</span><button type="button" style="min-height: 44px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: none; background: {{denim}}; color: #FFFFFF; text-decoration: none; font-family: inherit; font-size: 16px; font-weight: 700">送出審核結果</button></div>
</section>
</div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":1340}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0, sel: 0, dec: 0 }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const on = '2px solid ' + denim; const off = '1px solid #D8D2C4';
    const tabs = (names, key) => names.map((t, i) => ({ t: t, pressed: i === this.state[key] ? 'true' : 'false', border: i === this.state[key] ? on : off, bg: i === this.state[key] ? '#E4EAF4' : '#FFFFFF', weight: i === this.state[key] ? '700' : '400', pick: () => this.setState({ [key]: i }) }));
    const apps = [
      { i: '周', n: '周師傅', b: '冷氣 · [行政區] · 送出 [日期]', tag: '待審核', tagBg: '#EEEAE1', tagFg: '#4E525C' },
      { i: '吳', n: '吳師傅', b: '水電 · 補件回覆 [日期]', tag: '補件回覆', tagBg: '#FDF3D7', tagFg: '#6B4A00' },
      { i: '李', n: '李師傅', b: '門鎖 · 送出 [日期]', tag: '待審核', tagBg: '#EEEAE1', tagFg: '#4E525C' },
      { i: '許', n: '許師傅', b: '家電 · 送出 [日期]', tag: '待審核', tagBg: '#EEEAE1', tagFg: '#4E525C' }
    ];
    const sel = this.state.sel;
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      tabs: tabs(['待審核 5', '需要補件 2', '已通過', '未通過'], 'tab'),
      apps: apps.map((a, i) => Object.assign({}, a, { pressed: i === sel ? 'true' : 'false', bg: i === sel ? '#E4EAF4' : '#FFFFFF', pick: () => this.setState({ sel: i }) })),
      cur: apps[sel],
      info: [{ k: '真實姓名', v: '[真實姓名]' }, { k: '性別', v: '女' }, { k: '服務地區', v: '[縣市] [N] 區' }, { k: '出車費', v: 'NT$[XXX]（上限 500）' }],
      docs: [
        { t: '身分證正反面', ph: '[證件照片]', note: '姓名、生日已比對', fg: '#245443' },
        { t: '本人手持身分證', ph: '[照片]', note: '與證件照片相符', fg: '#245443' },
        { t: '良民證（選填）', ph: '[掃描檔]', note: '發證日期 [日期]，一年內，符合 · 通過後顯示標章', fg: '#245443' },
        { t: '冷凍空調技術士（選填）', ph: '[掃描檔]', note: '證號 [號碼] · 人工檢視', fg: '#4E525C' },
        { t: '切結書', ph: '[簽署紀錄]', note: '已簽署 [日期 時間]', fg: '#245443' },
        { t: '自我介紹影片', ph: '[影片 0:45]', note: '待觀看', fg: '#6B4A00' }
      ],
      checks: ['證件姓名與申請資料一致', '手持照片與證件照片是同一人', '良民證發證日期在一年內（有附才檢查）', '已視訊確認良民證正本（有附才檢查）', '證照姓名與證件一致（有附才檢查）', '自我介紹影片沒有不當內容'],
      decisions: tabs(['通過', '需要補件', '不通過'], 'dec')
    };
  }
}
</script>
</body>
</html>
