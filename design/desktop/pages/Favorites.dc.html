<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 我信任的師傅</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 10-31：電腦版夠寬，詞不從中間斷開（在標點、空白處換行）；「·」跟著前面的字 */
body{word-break:keep-all;overflow-wrap:break-word}
p{word-break:normal}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<div style="display: flex; align-items: center; gap: 56px">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<nav style="display: flex; gap: 36px; font-size: 18px"><a href="Dashboard.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">首頁</a><a href="TechList.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">找師傅</a><a href="Records.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">維修紀錄</a><a href="Safety.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">我的家</a></nav>
</div>
<div style="display: flex; align-items: center; gap: 16px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a>

<a href="Messages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">林</span><span style="font-size: 16px; font-weight: 500">林小姐</span></a>
</div>
</header>
<div style="padding: 40px 80px 0; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">我信任的師傅</h1><p style="margin: 0; font-size: 18px; color: #4E525C">信任的師傅會優先推薦給你；封鎖的師傅不會再出現在推薦和列表裡。</p></div>
<div style="display: flex; gap: 8px"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: {{t.border}}; background: {{t.bg}}; color: #23262E; font-family: inherit; font-size: 16px; font-weight: {{t.weight}}">{{t.t}}</button></sc-for></div>
</div>
<div style="flex-grow: 1; padding: 28px 80px 64px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; align-items: start">
<section style="grid-column: span 8; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{trust}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{favs}}" as="p" hint-placeholder-count="3">
<div style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 24px 28px; display: flex; align-items: center; gap: 20px">
<span style="flex-shrink: 0; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 64px; height: 64px; border-radius: 50%; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900">{{p.i}}</span><span style="display: flex; flex-direction: column; align-items: center; line-height: 1.4; white-space: nowrap"><span style="font-size: 18px; font-weight: 900">[N.N]<span style="font-size: 14px; font-weight: 500; color: #62666F"> / 5</span></span><span style="font-size: 14px; color: #62666F">[N]&nbsp;則評價</span></span></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px"><span style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px"><span style="font-size: 20px; font-weight: 900">{{p.n}}</span><span style="padding: 2px 8px; border-radius: 999px; background: {{p.gBg}}; color: {{p.gFg}}; font-size: 14px; font-weight: 700; white-space: nowrap">{{p.g}}</span><span style="padding: 2px 8px; border-radius: 999px; background: #E4EAF4; color: #26406E; font-size: 14px; font-weight: 700; white-space: nowrap">[N]&nbsp;次服務</span></span><span style="display: flex; flex-direction: column; line-height: 1.6"><span style="font-size: 16px; color: #23262E">{{p.s}}</span><span style="font-size: 15px; color: #62666F"><span style="white-space: nowrap">冷凍空調技術士&nbsp;[N]&nbsp;年</span>&nbsp;· <span style="white-space: nowrap">另有&nbsp;[N]&nbsp;張證照</span></span></span><span style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{p.badges}}" as="bd" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; background: #E4F0EA; color: #245443; font-size: 14px; font-weight: 700; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>{{bd}}</span></sc-for></span></span>
<span style="width: 150px; flex-shrink: 0; display: flex"><span style="padding: 6px 14px; border-radius: 999px; white-space: nowrap; background: {{p.onBg}}; font-size: 16px; font-weight: 700; color: {{p.onFg}}">{{p.status}}</span></span>
<span style="flex-shrink: 0; display: flex; gap: 8px; align-items: center; white-space: nowrap"><a href="Tech.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 16px; border: 1.5px solid {{accent}}; background: #FFFFFF; color: {{accent}}; font-weight: 700">預約</a><a href="Messages.dc.html" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 16px; border: 1.5px solid {{denim}}; background: #FFFFFF; color: {{denim}}; font-weight: 700">傳訊息</a><button type="button" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 16px; border: none; background: #EEEAE1; color: #23262E; font-weight: 700">移除</button></span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{block}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 22px 26px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">封鎖原因</span><span style="font-size: 15px; color: #62666F">只有平台客服看得到，師傅不會知道</span></div>
<div role="radiogroup" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px"><sc-for list="{{reasons}}" as="r" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="min-height: 44px; padding: 0 6px; border-radius: 999px; border: {{r.border}}; background: {{r.bg}}; color: #23262E; font-family: inherit; font-size: 16px; font-weight: {{r.weight}}; white-space: nowrap">{{r.t}}</button></sc-for></div>
<input type="text" placeholder="想補充的話（選填）" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400">
<button type="button" style="align-self: flex-end; min-height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: #B42318; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">確認封鎖</button>
</div>
<sc-for list="{{blocked}}" as="p" hint-placeholder-count="2">
<div style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 22px 26px; display: flex; align-items: center; gap: 18px">
<span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; background: #EEEAE1; color: #62666F; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900">{{p.i}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 18px; font-weight: 900">{{p.n}}</span><span style="padding: 3px 10px; border-radius: 999px; background: #E4EAF4; color: #26406E; font-size: 14px; font-weight: 700; white-space: nowrap">[N] 次服務</span></span><span style="font-size: 16px; color: #4E525C">{{p.s}}</span></span>
<span style="width: 150px; flex-shrink: 0; display: flex"><span style="padding: 6px 14px; border-radius: 999px; white-space: nowrap; background: {{p.onBg}}; font-size: 16px; font-weight: 700; color: {{p.onFg}}">{{p.status}}</span></span>
<button type="button" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 16px; border: 1.5px solid {{denim}}; background: #FFFFFF; color: {{denim}}; font-weight: 700">解除封鎖</button>
</div>
</sc-for>
</div>
</sc-if>
</section>
<aside style="grid-column: span 4; padding: 24px; border-radius: 20px; background: #E4EAF4; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 18px; font-weight: 700; color: #26406E; margin-bottom: 4px">{{asideT}}</span>
<sc-for list="{{asideItems}}" as="i" hint-placeholder-count="3"><div style="display: flex; gap: 8px; font-size: 16px; line-height: 1.6; color: #23262E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>{{i.pre}}<sc-if value="{{i.has}}" hint-placeholder-val="{{ false }}"><a href="{{i.href}}">{{i.link}}</a></sc-if>{{i.post}}</span></div></sc-for>
<a href="Report.dc.html" style="align-self: flex-end; font-size: 16px">回報與申訴 →</a>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"list":{"editor":"enum","options":["我信任的師傅","封鎖名單"],"default":"我信任的師傅"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: null }; }
  renderVals() {
    const L = (s) => { const m = String(s).match(/^(.*?)\[\[(.+?)\|(.+?)\]\](.*)$/); return m ? { pre: m[1], has: true, link: m[2], href: m[3] + '.dc.html', post: m[4] } : { pre: s, has: false, link: '', href: '#', post: '' }; };
    const denim = this.props.denim ?? '#3A5A94';
    const fromProp = (this.props.list ?? '我信任的師傅') === '封鎖名單' ? 1 : 0;
    const tab = this.state.tab === null ? fromProp : this.state.tab;
    const on = '2px solid ' + denim; const off = '1px solid #D8D2C4';
    const fem = { g: '女師傅', gBg: '#9C3D6B', gFg: '#FFFFFF' };
    const male = { g: '男師傅', gBg: '#3A5A94', gFg: '#FFFFFF' };
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      trust: tab === 0, block: tab === 1,
      tabs: ['我信任的師傅', '封鎖名單'].map((t, i) => ({ t: t, pressed: i === tab ? 'true' : 'false', border: i === tab ? on : off, bg: i === tab ? '#E4EAF4' : '#FFFFFF', weight: i === tab ? '700' : '400', pick: () => this.setState({ tab: i }) })),
      favs: [
        Object.assign({ i: '林', n: '林師傅', s: '冷氣安裝、保養 · 合作 [N] 次', status: '在線中', onFg: '#245443', onBg: '#E4F0EA', badges: ['身分驗證', '良民證', '證照'] }, fem),
        Object.assign({ i: '陳', n: '陳師傅', s: '水電、漏水 · 合作 [N] 次', status: '可視訊：今晚', onFg: '#26406E', onBg: '#E4EAF4', badges: ['身分驗證', '證照'] }, fem),
        Object.assign({ i: '張', n: '張師傅', s: '門鎖、居家修繕 · 合作 [N] 次', status: '可視訊：明天', onFg: '#26406E', onBg: '#E4EAF4', badges: ['身分驗證', '良民證'] }, male)
      ],
      blocked: [{ i: '王', n: '王師傅', s: '封鎖於 [日期] · 原因：讓我不舒服', status: '在線中', onBg: '#E4F0EA', onFg: '#245443' }, { i: '李', n: '李師傅', s: '封鎖於 [日期] · 原因：收費和報價不符', status: '可視訊：明天', onBg: '#EEEAE1', onFg: '#4E525C' }],
      reasons: ['不準時', '態度不好', '報價不清楚', '讓我不舒服', '其他'].map((t) => { const on = (this.state.reason ?? '讓我不舒服') === t; return { t, on: String(on), border: on ? '2px solid #3A5A94' : '1px solid #D8D2C4', bg: on ? '#E4EAF4' : '#FFFFFF', weight: on ? '700' : '400', pick: () => this.setState({ reason: t }) }; }),
      asideT: tab === 0 ? '為什麼要透過平台找師傅？' : '封鎖之後',
      asideItems: (tab === 0 ? ['每次都有錄影存證、報價紀錄和評價', '有問題可以申訴，平台會邀請雙方協商', '視訊時不交換電話或 LINE，聯絡方式要不要給由你決定'] : ['這位師傅不會再出現在你的推薦和師傅列表', '師傅看不到你的公開求助', '平台不會通知師傅，他不會知道被你封鎖', '如果是因為不舒服的經驗，也可以到「[[回報與申訴|Report]]」告訴我們']).map(L),
    };
  }
}
</script>
</body>
</html>
