<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"tab":{"editor":"enum","options":["扣款與取消規則","服務條款","隱私政策","錄影與資料保存"],"default":"扣款與取消規則"},"$preview":{"width":1440,"height":988}}'>

  constructor(props) { super(props); this.state = { doc: null, sub: 0 }; }

        { h: '視訊診斷估價', items: ['視訊只做診斷與報價。師傅可能提醒說明書上的一般操作，但不會指導你拆裝或碰觸電線、瓦斯', '預約前先綁定信用卡，綁定時不扣款', '雙方都上線後才開始計時，每次「10 分鐘」，剩「2 分鐘」時提醒', '視訊滿「3 分鐘」才算一次；不滿「3 分鐘」結束，不收費也不算次數', '第 2 次可以找同一位師傅，也可以換一位師傅', '第 2 次視訊到期前「2 小時」，會用 LINE 或簡訊提醒你', '扣款時間：第 2 次視訊結束、你選擇「不用了」，或第 1 次視訊後滿「24 小時」，以先到者為準'] },
        { h: '視訊的取消與遲到', items: ['預約前「2 小時」以上取消或改期，不收費', '你在「2 小時」內取消，或遲到超過「5 分鐘」：這次視訊取消，扣平台費（求助）NT$100，第 2 次視訊仍可使用', '師傅在「2 小時」內取消，或遲到超過「5 分鐘」：你不用付費，這次不算次數，有效期限延長「24 小時」', '師傅視訊後「30 分鐘」內沒送出報價：這次不算次數，你可以直接找其他師傅'] },
        { h: '到府維修', items: ['先視訊再預約到府，不另收平台費', '直接預約到府要師傅接受才成立，師傅也可以請你先視訊', '急件：師傅會在「30 分鐘」內回覆，沒回覆就自動取消、不收費；師傅接受後，保證「12 小時內」到府', '師傅要照線上報價施工；報價單分成出車費與維修費，並寫明預計維修所需時間和保固天數', '預約後，預計維修所需時間會一起保留在師傅的排班', '現場要加價，必須在平台上取得你的同意；你不同意，就照原本的報價', '保固天數由師傅在報價單上提供，平台負責記錄'] },
        { h: '到府的取消、遲到與沒人開門', items: ['到府「前 12 小時以上」取消或改期，不收費', '到府「前 12 小時內」取消，收逾時費（臨時取消）NT$100；改期，收逾時費（臨時改期）NT$50', '急件：預約成立「1 小時內」取消，不收費；預約成立「1 小時後」取消，收逾時費（臨時取消）NT$100', '師傅到場、等候「15 分鐘」沒人開門（師傅需打卡定位並拍門牌照片），收逾時費（沒人開門）NT$100', '現場決定不修，只付出車費', '師傅在到府「前 2 小時以上」事先通知會晚到，你也確認同意新的時間：出車費和維修費照報價付', '師傅沒事先通知、晚到「超過 30 分鐘」，你決定取消：出車費、維修費都不用付', '師傅沒事先通知、晚到「超過 30 分鐘」，你決定繼續等：出車費減半，平台會自動從應付金額扣除', '核對碼不一致：請不要開門，案件暫停，你可以免費取消，平台會調查', '先視訊再到府的平台費（求助），不會因為到府取消而退還；申訴成立時例外'] },
        { h: '退款與補償', items: ['退款一律退回原本的信用卡', '申訴成立，平台會依案件情況退還費用', '天災等不可抗力造成無法到府，雙方都不收費', '開始前「24 小時」，以及免費取消期限前，會用 LINE 或簡訊提醒你'] }
      ] },
      { t: '服務條款', lead: '[服務條款前言：說明傻媽萬事通是媒合平台，維修服務由師傅提供。]', secs: [
        { h: '平台的角色', items: ['[平台提供媒合、視訊、預約與安全機制]', '[維修服務契約存在於客戶與師傅之間]'] },
        { h: '會員義務', items: ['[需以本人手機號碼註冊，一支手機一個帳號；違規紀錄會保留]', '[平台外的私下交易，不在錄影、評價與申訴的保障範圍內]', '[視訊中不得交換 LINE 或電話；視訊中要求交換屬違規，第一次警告、再犯停權]'] },
        { h: '師傅義務', items: ['[維持證照有效；良民證為選填，發證一年內有效，逾期移除標章]', '[簽署切結書，聲明所附文件真實]', '[出車費自訂，上限 NT$500；保固天數由師傅在報價單上自行提供並負責]', '[發現瓦斯、電線等危險時，先請客戶斷電斷氣並撥打 119]'] },
        { h: '平台的責任範圍', items: ['[平台不承擔施工本身的責任，但提供申訴、協商與停權機制]', '[拒絕出席協商的師傅，平台會暫停其接案]', '[平台不提供緊急救援服務，遇到危險請直接撥打 110 或 119]'] },
        { h: '師傅的身分', items: ['[師傅為獨立接案者，自行決定接案時間與報價]'] },
        { h: '評價', items: ['[評價在雙方都評價後或「7 天」後公開，只顯示部分稱呼]', '[師傅不能刪除評價，平台只移除違反規範的內容]'] },
        { h: '爭議處理', items: ['[雙方可透過「[[回報與申訴|Report]]」提出，平台調閱報價紀錄與錄影後邀請雙方協商]'] }

        { h: '你的權利', items: ['[隨時查詢、更正或刪除你的資料]'] }
      ] },

        { h: '誰看得到錄影', items: ['只有你和這次的師傅看得到（申訴調閱或依法要求時除外）', '視訊開始前，雙方都要同意錄影', '有申訴時，平台客服經你同意後調閱'] },
        { h: '保存多久', items: ['錄影保存 [N] 天後自動刪除', '你可以隨時在「[[維修紀錄|Records]]」裡提早刪除', '有申訴進行中的錄影，會保留到申訴結束'] },
        { h: '診斷單', items: ['診斷內容由師傅填寫，存在你的維修紀錄', '錄影不會交給 AI 或其他第三方分析'] }

</script>
