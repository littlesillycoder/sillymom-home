<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 訊息</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 10-31：電腦版夠寬，詞不從中間斷開（在標點、空白處換行）；「·」跟著前面的字 */
body{word-break:keep-all;overflow-wrap:break-word}
p{word-break:normal}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 980px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<div style="display: flex; align-items: center; gap: 56px">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<nav style="display: flex; gap: 36px; font-size: 18px"><a href="Dashboard.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">首頁</a><a href="TechList.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">找師傅</a><a href="Records.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">維修紀錄</a><a href="Safety.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">我的家</a></nav>
</div>
<div style="display: flex; align-items: center; gap: 16px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a>

<a href="Messages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">林</span><span style="font-size: 16px; font-weight: 500">林小姐</span></a>
</div>
</header>
<div style="flex-grow: 1; padding: 32px 80px 48px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; min-height: 0">
<aside style="grid-column: span 4; padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 20px; font-weight: 900; color: {{denim}}">訊息</h2>
<sc-for list="{{convos}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="padding: 14px; border-radius: 14px; border: none; background: {{c.bg}}; font-family: inherit; color: #23262E; text-align: left; display: flex; gap: 12px; align-items: center">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900">{{c.i}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; justify-content: space-between"><span style="font-size: 16px; font-weight: 700">{{c.n}}</span><span style="font-size: 13px; color: #62666F">{{c.time}}</span></span><span style="font-size: 16px; color: #4E525C">{{c.last}}</span></span>
</button>
</sc-for>
</aside>
<section style="grid-column: span 8; padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 0; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 18px 24px; border-bottom: 1px solid #E2DDD2; display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 10px"><span style="font-size: 18px; font-weight: 900">{{cur.n}}</span><span style="font-size: 13px; color: #245443">已通過平台審核</span></span>
<span style="display: flex; gap: 16px; font-size: 16px"><a href="Tech.dc.html">看個人頁</a><a href="Checkout.dc.html">預約視訊</a></span>
</div>
<div style="padding: 12px 24px; background: #E4EAF4; color: #26406E; font-size: 16px">可以直接在這裡傳照片和影片。視訊時不可以交換 LINE 或電話；私下交易沒有錄影、評價和申訴保障。師傅要求私下付款，請 <a href="Report.dc.html">回報</a>。</div>
<div style="flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{cur.msgs}}" as="m" hint-placeholder-count="4">
<div style="align-self: {{m.side}}; max-width: 460px; padding: 12px 16px; border-radius: 16px; background: {{m.bg}}; color: {{m.fg}}; font-size: 16px; line-height: 1.7">{{m.t}}</div>
</sc-for>
</div>
<div style="padding: 16px 24px; border-top: 1px solid #E2DDD2; display: flex; gap: 10px">
<button type="button" aria-label="附加照片" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; color: #4E525C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6"></path></svg></button>
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">輸入訊息</label>
<input id="msg" type="text" placeholder="輸入訊息…" style="flex-grow: 1; min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid #D8D2C4; font-family: inherit; font-size: 16px; color: #23262E">
<button type="button" style="min-height: 48px; padding: 0 20px; border-radius: 12px; font-family: inherit; font-size: 16px; background: {{accent}}; color: #FFFFFF; border: none; font-weight: 700">送出</button>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const me = (t) => ({ t: t, side: 'flex-end', bg: denim, fg: '#FFFFFF' });
    const them = (t) => ({ t: t, side: 'flex-start', bg: '#F6F3EC', fg: '#23262E' });
    const convos = [
      { i: '林', n: '林師傅', time: '14:02', last: '明天 14:00 見，出發前會通知你', msgs: [me('請問明天到府大概要多久？'), them('換排水管大約 40 分鐘。我出發前 30 分鐘會通知你。'), me('好的，大樓要先在管理室登記。'), them('收到，明天 14:00 見。')] },
      { i: '黃', n: '黃師傅', time: '[日期]', last: '洗衣機已經正常了嗎？', msgs: [them('洗衣機已經正常了嗎？'), me('正常了，謝謝！')] },
      { i: '平', n: '傻媽萬事通客服', time: '[日期]', last: '你的回報我們已經收到', msgs: [them('你的回報我們已經收到，會在 72 小時內回覆你。')] }
    ];
    const sel = this.state.sel;
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      convos: convos.map((c, i) => Object.assign({}, c, { pressed: i === sel ? 'true' : 'false', bg: i === sel ? '#E4EAF4' : '#FFFFFF', pick: () => this.setState({ sel: i }) })),
      cur: convos[sel]
    };
  }
}
</script>
</body>
</html>
