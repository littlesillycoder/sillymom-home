:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}

<div style="flex-grow: 1; padding: 28px 80px 64px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; align-items: start">
<div style="grid-column: span 8; display: flex; flex-direction: column; gap: 20px">
<div style="height: 420px; border-radius: 24px; background: #23262E; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; padding: 20px">

<sc-for list="{{notes}}" as="n" hint-placeholder-count="3"><div style="display: flex; gap: 8px; font-size: 16px; line-height: 1.6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>{{n}}</span></div></sc-for>
<a href="#" style="align-self: flex-end; text-align: right; font-size: 16px">下載診斷單（PDF）</a>
</section>
</div>
<aside style="grid-column: span 4; display: flex; flex-direction: column; gap: 20px">

<span style="align-self: flex-start; padding: 4px 10px; border-radius: 6px; background: #E4EAF4; color: #26406E; font-size: 16px; font-weight: 700">師傅的診斷單</span>
<sc-for list="{{summary}}" as="s" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 2px; font-size: 16px; line-height: 1.7"><span style="font-weight: 700; color: #4E525C">{{s.k}}</span><span>{{s.v}}</span></div></sc-for>
</div>
<div style="padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 18px; font-weight: 700">費用與發票</span>
<div style="display: flex; justify-content: space-between; font-size: 16px"><span style="color: #4E525C">平台費（求助，含 2 次視訊）</span><span style="font-weight: 700">NT$100</span></div>
<div style="display: flex; justify-content: space-between; font-size: 16px"><span style="color: #4E525C">電子發票</span><span>[發票號碼] · 已存入手機條碼</span></div>
<a href="#" style="align-self: flex-end; text-align: right; font-size: 16px">下載發票證明聯（PDF）</a>
</div>
<div style="padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1.5px solid #B42318; display: flex; flex-direction: column; gap: 10px">

<button type="button" style="min-height: 48px; border-radius: 12px; border: none; background: #B42318; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">刪除這段錄影</button>
</div>
<a href="Report.dc.html" style="align-self: flex-end; text-align: right; font-size: 16px; color: #4E525C">這次服務有問題？回報給平台</a>

</div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":1119}}'>
class Component extends DCLogic {
  renderVals() {
    const tech = (ts, t) => ({ ts: ts, who: '林師傅', t: t, fg: '#26406E' });
    const me = (ts, t) => ({ ts: ts, who: '你', t: t, fg: '#23262E' });
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      notes: ['錄影保存 [N] 天後自動刪除。你可以提早刪除；有申訴進行中，會保留到申訴結束', '錄影只用於回看與申訴，不會交給 AI 或其他第三方分析', '雙方在視訊開始前都已同意錄影'],
      summary: [{ k: '原因', v: '排水口附近積灰，造成排水不順。' }, { k: '建議', v: '清洗濾網後已不滴水，問題已在視訊中解決。' }, { k: '保固與提醒', v: '若清洗後仍滴水，可能是排水管破損，再預約到府。' }]
    };
  }
}
