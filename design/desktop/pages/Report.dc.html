<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 回報與申訴</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 10-31：電腦版夠寬，詞不從中間斷開（在標點、空白處換行）；「·」跟著前面的字 */
body{word-break:keep-all;overflow-wrap:break-word}
p{word-break:normal}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 1031px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<div style="display: flex; align-items: center; gap: 56px">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<nav style="display: flex; gap: 36px; font-size: 18px"><a href="Dashboard.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">首頁</a><a href="TechList.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">找師傅</a><a href="Records.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">維修紀錄</a><a href="Safety.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">我的家</a></nav>
</div>
<div style="display: flex; align-items: center; gap: 16px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a>

<a href="Messages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">林</span><span style="font-size: 16px; font-weight: 500">林小姐</span></a>
</div>
</header>
<div style="padding: 40px 80px 0; display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">回報與申訴</h1><p style="margin: 0; font-size: 18px; color: #4E525C">你的回報只有平台客服看得到，不會提供你的資料給師傅。</p></div>
<div style="flex-grow: 1; padding: 24px 80px 64px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; align-items: start">
<form style="grid-column: span 8; padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 22px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">是哪一次的服務？<select style="min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>[日期] · 林師傅 · 冷氣室內機滴水（視訊）</option></select></label>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 700">發生了什麼事？</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="6"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 52px; border-radius: 12px; border: {{t.border}}; background: {{t.bg}}; color: #23262E; font-family: inherit; font-size: 16px; font-weight: {{t.weight}}">{{t.t}}</button></sc-for>
</div>
</fieldset>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">請描述經過<textarea rows="5" placeholder="時間、對方說了或做了什麼，越具體越好" style="font-family: inherit; font-size: 16px; line-height: 1.7; padding: 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #F6F3EC; color: #23262E; font-weight: 400; resize: none"></textarea></label>
<button type="button" style="align-self: flex-start; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1.5px dashed #B9B3A6; background: #FFFFFF; color: #4E525C; font-family: inherit; font-size: 16px">＋ 附上截圖或照片（選填）</button>
<label style="display: flex; align-items: flex-start; gap: 12px; font-size: 16px; line-height: 1.7"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: {{denim}}"><span>同意客服調閱這次的視訊錄影與訊息紀錄</span></label>
<a href="Dashboard.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 14px; text-decoration: none; font-size: 18px; background: {{accent}}; color: #FFFFFF; border: none; font-weight: 700">送出回報</a>
</form>
<aside style="grid-column: span 4; padding: 24px; border-radius: 20px; background: #E4EAF4; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 18px; font-weight: 700; color: #26406E">送出之後</span>
<sc-for list="{{after}}" as="a" hint-placeholder-count="4"><div style="display: flex; gap: 8px; font-size: 16px; line-height: 1.6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>{{a}}</span></div></sc-for>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":1031}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { type: 0 }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const on = '2px solid ' + denim; const off = '1px solid #D8D2C4';
    const names = ['言行讓我不舒服', '收費和報價不符', '服務品質問題', '師傅沒有出現', '其他'];
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      types: names.map((t, i) => ({ t: t, pressed: i === this.state.type ? 'true' : 'false', border: i === this.state.type ? on : off, bg: i === this.state.type ? '#E4EAF4' : '#FFFFFF', weight: i === this.state.type ? '700' : '400', pick: () => this.setState({ type: i }) })),
      after: ['客服會在 72 小時內回覆你；處理結果會用訊息通知，必要時也會打電話聯絡', '涉及安全的回報會優先處理，視情況暫停師傅接案', '收費爭議會調閱報價紀錄與錄影，邀請雙方協商', '拒絕出席協商的師傅，會暫停接案', '有新進度時，會用簡訊通知你「有新進度，請到平台查看」；有加 LINE 官方帳號的話，也會用 LINE 通知。回報內容和錄影不會傳到 LINE']
    };
  }
}
</script>
</body>
</html>
