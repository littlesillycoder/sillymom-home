<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 求助表單（未登入）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 10-31：電腦版夠寬，詞不從中間斷開（在標點、空白處換行）；「·」跟著前面的字 */
body{word-break:keep-all;overflow-wrap:break-word}
p{word-break:normal}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 1605px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">

<header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg>
</span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" style="padding: 12px 16px; font-size: 16px; color: #4E525C; text-decoration: none">回首頁</a>
<a href="Login.dc.html" style="padding: 12px 20px; font-size: 16px; color: #23262E; text-decoration: none">登入</a>
<a href="Login.dc.html" style="padding: 12px 24px; border-radius: 999px; border: 1.5px solid {{denim}}; color: {{denim}}; text-decoration: none; font-size: 16px; font-weight: 500">免費註冊</a>
</div>
</header>

<div style="padding: 40px 80px 0; display: flex; flex-direction: column; gap: 28px">
<ol aria-label="求助步驟" style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 16px; font-size: 16px">
<li aria-current="step" style="display: flex; align-items: center; gap: 10px; font-weight: 700; color: {{denim}}"><span style="width: 32px; height: 32px; border-radius: 50%; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px">1</span>描述問題</li>
<li aria-hidden="true" style="width: 48px; height: 2px; background: #D8D2C4"></li>
<li style="display: flex; align-items: center; gap: 10px; color: #62666F"><span style="width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #B9B3A6; display: flex; align-items: center; justify-content: center; font-size: 15px">2</span>手機驗證</li>
<li aria-hidden="true" style="width: 48px; height: 2px; background: #D8D2C4"></li>
<li style="display: flex; align-items: center; gap: 10px; color: #62666F"><span style="width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #B9B3A6; display: flex; align-items: center; justify-content: center; font-size: 15px">3</span>推薦師傅</li>
<li aria-hidden="true" style="width: 48px; height: 2px; background: #D8D2C4"></li>
<li style="display: flex; align-items: center; gap: 10px; color: #62666F"><span style="width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #B9B3A6; display: flex; align-items: center; justify-content: center; font-size: 15px">4</span>確認與付款</li>
</ol>
<h1 style="margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">告訴我們發生了什麼事</h1>
</div>

<div style="flex-grow: 1; padding: 32px 80px 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; align-items: start">
<form style="grid-column: span 2; display: flex; flex-direction: column; gap: 24px">

<fieldset style="margin: 0; padding: 28px; border: 1px solid #E2DDD2; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<legend style="float: left; width: 100%; padding: 0; margin: 0; font-size: 20px; font-weight: 700">哪一類的問題？</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 64px; padding: 10px 14px; border-radius: 14px; border: {{c.border}}; background: {{c.bg}}; color: #23262E; font-family: inherit; font-size: 18px; font-weight: {{c.weight}}; display: flex; align-items: center; gap: 12px; text-align: left; line-height: 1.3; cursor: pointer"><span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; background: {{c.ibg}}; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2F4F86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg></span>{{c.t}}</button>
</sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 28px; border: 1px solid #E2DDD2; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<legend style="float: left; width: 100%; padding: 0; margin: 0; font-size: 20px; font-weight: 700">描述一下狀況<span style="margin-left: 10px; padding: 2px 10px; border-radius: 999px; background: #FBE3DE; color: #8E2E1F; font-size: 14px; font-weight: 700; vertical-align: 3px">必填</span></legend>
<label for="desc" style="font-size: 16px; color: #4E525C">什麼時候開始、有什麼聲音或味道、你試過什麼，寫越多師傅越好判斷</label>
<textarea id="desc" rows="4" style="font-family: inherit; font-size: 16px; line-height: 1.8; padding: 16px; border: 1px solid #D8D2C4; border-radius: 14px; background: #F6F3EC; color: #23262E; resize: none">客廳冷氣室內機這兩天一直滴水，滴在地板上。開冷氣大概半小時後開始滴，遙控器顯示正常。上個月才清洗過濾網。</textarea>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 16px; color: #4E525C">照片或短影片（選填，最多 5 個）</span>
<div style="display: flex; gap: 12px">
<div style="width: 120px; height: 120px; border-radius: 14px; background: #E4EAF4; color: #26406E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6"></path></svg>
[照片 1]</div>
<div style="width: 120px; height: 120px; border-radius: 14px; background: #E4EAF4; color: #26406E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h12v12H3zM15 10l6-3v10l-6-3z"></path></svg>
[影片 0:12]</div>
<button type="button" style="width: 120px; height: 120px; border-radius: 14px; border: 1.5px dashed #B9B3A6; background: #F6F3EC; color: #4E525C; font-family: inherit; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
新增</button>
</div>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 28px; border: 1px solid #E2DDD2; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 20px">
<legend style="float: left; width: 100%; padding: 0; margin: 0; font-size: 20px; font-weight: 700">你希望怎麼處理？</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{hows}}" as="h" hint-placeholder-count="2"><button type="button" aria-pressed="{{h.on}}" onClick="{{h.pick}}" style="min-height: 96px; padding: 18px 20px; border-radius: 14px; border: {{h.border}}; background: {{h.bg}}; color: #23262E; font-family: inherit; text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer">
<span style="font-size: 18px; font-weight: 700">{{h.t}}</span>
<span style="font-size: 16px; color: #4E525C">{{h.b}}</span>
</button></sc-for>
</div>
<sc-if value="{{home}}" hint-placeholder-val="{{ false }}"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">縣市<select style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>[縣市]</option></select></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">行政區<select style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>[行政區]</option></select></label></div></sc-if>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 16px; color: #4E525C">什麼時候需要？</span>
<div style="display: flex; gap: 10px">
<sc-for list="{{whens}}" as="w" hint-placeholder-count="3"><button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: {{w.border}}; background: {{w.bg}}; color: #23262E; font-family: inherit; font-size: 16px; font-weight: {{w.weight}}; cursor: pointer">{{w.t}}</button></sc-for>
</div>
</div>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 500"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: {{denim}}">只要女師傅</label>
</fieldset>
</form>

<aside style="display: flex; flex-direction: column; gap: 20px">

<div style="padding: 28px; border-radius: 20px; background: #E4EAF4; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 18px; font-weight: 700; color: #26406E">你的資料怎麼被保護</span>
<sc-for list="{{privacy}}" as="p" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; font-size: 16px; line-height: 1.7; color: #23262E">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M5 12l5 5L20 7"></path></svg>
<span>{{p}}</span>
</div>
</sc-for>
</div>

<a href="SignUp.dc.html" style="min-height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 700">送出，幫我找師傅</a>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px"><li style="display: flex; gap: 8px; font-size: 16px; line-height: 1.6; color: #62666F; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>下一步用手機號碼快速驗證，你填的內容都會保留。</span></li><li style="display: flex; gap: 8px; font-size: 16px; line-height: 1.6; color: #62666F; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>送出不會收費。</span></li><li style="display: flex; gap: 8px; font-size: 16px; line-height: 1.6; color: #62666F; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>先視訊：平台費（求助）NT$100 含 2 次視訊，求助結束後才扣款。</span></li><li style="display: flex; gap: 8px; font-size: 16px; line-height: 1.6; color: #62666F; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>直接預約到府：平台費（直接預約到府）NT$100，核對碼確認後才扣款。</span></li></ul>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":1605}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: '冷氣', how: 0, when: 0 }; }
  renderVals() {
    const ICONS = {"水電與漏水": "M12 3s6 7 6 11a6 6 0 01-12 0c0-4 6-11 6-11z", "冷氣": "M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9", "家電": "M5 3h14v18H5zM12 9a4 4 0 110 8 4 4 0 010-8zM8 6h2", "燈具與插座": "M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0012 3z", "門鎖": "M5 11h14v10H5zM8 11V8a4 4 0 018 0v3", "3C 與網路": "M3 4h18v12H3zM8 20h8M12 16v4", "智慧家電與監視器": "M4 5h16v4H4zM6 9v2a6 6 0 0012 0V9M12 13v.5", "油漆與小裝修": "M4 4h13v5H4zM17 6h3v6h-8v3M11 15h2v6h-2z", "除蟲": "M12 7a3 3 0 013 3v6a3 3 0 01-6 0v-6a3 3 0 013-3zM12 7V4M9 12H4M15 12h5M9 16l-4 3M15 16l4 3M9 9L5 6M15 9l4-3", "家具組裝": "M14.5 6.5a4 4 0 00-5 5L4 17l3 3 5.5-5.5a4 4 0 005-5l-2.5 2.5-2.5-.5-.5-2.5z", "居家小修繕": "M4 11l8-7 8 7v9H4zM10 20v-5h4v5", "不確定是哪一類": "M12 21a9 9 0 110-18 9 9 0 010 18zM9.5 9.5a2.5 2.5 0 115 .5c0 1.5-2.5 2-2.5 3.5M12 17v.5"};
    const st = this.state;
    const denim = this.props.denim ?? '#3A5A94';
    const names = ['水電與漏水', '冷氣', '家電', '燈具與插座', '門鎖', '3C 與網路', '智慧家電與監視器', '油漆與小裝修', '除蟲', '家具組裝', '居家小修繕', '不確定是哪一類'];
    return {
      accent: this.props.accent ?? '#C8412C',
      denim: denim,
      cats: names.map((t) => ({ t: t, d: ICONS[t] || ICONS['不確定是哪一類'], on: t === st.cat ? 'true' : 'false', border: t === st.cat ? '2px solid ' + denim : '1px solid #D8D2C4', bg: t === st.cat ? '#E4EAF4' : '#FFFFFF', ibg: t === st.cat ? '#FFFFFF' : '#E4EAF4', weight: t === st.cat ? '700' : '500', pick: () => this.setState({ cat: t }) })),
      hows: [{ t: '先視訊看看', b: '不用讓人進門，先知道原因和報價' }, { t: '直接安排到府', b: '需要填寫行政區，完整地址預約確認後才提供' }].map((h, i) => Object.assign({}, h, { on: i === st.how ? 'true' : 'false', border: i === st.how ? '2px solid ' + denim : '1px solid #D8D2C4', bg: i === st.how ? '#E4EAF4' : '#FFFFFF', pick: () => this.setState({ how: i }) })),
      home: st.how === 1,
      whens: ['現在', '今天稍晚', '指定日期時間'].map((t, i) => ({ t: t, on: i === st.when ? 'true' : 'false', border: i === st.when ? '2px solid ' + denim : '1px solid #D8D2C4', bg: i === st.when ? '#E4EAF4' : '#FFFFFF', weight: i === st.when ? '700' : '400', pick: () => this.setState({ when: i }) })),
      privacy: [
        '只有通過審核的師傅看得到你的求助',
        '師傅只看得到行政區，看不到你的完整地址',
        '照片和影片只用於這次維修和你的維修紀錄，可以自行刪除'
      ]
    };
  }
}
</script>
</body>
</html>
