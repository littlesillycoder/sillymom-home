<body>

<helmet>

<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 10-31：電腦版夠寬，詞不從中間斷開（在標點、空白處換行）；「·」跟著前面的字 */
body{word-break:keep-all;overflow-wrap:break-word}
p{word-break:normal}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 999px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<sc-if value="{{guest}}" hint-placeholder-val="{{ false }}"><header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" style="padding: 12px 16px; font-size: 16px; color: #4E525C; text-decoration: none">回首頁</a>
<a href="Login.dc.html" style="padding: 12px 20px; font-size: 16px; color: #23262E; text-decoration: none">登入</a>
<a href="Login.dc.html" style="padding: 12px 24px; border-radius: 999px; border: 1.5px solid {{denim}}; color: {{denim}}; text-decoration: none; font-size: 16px; font-weight: 500">免費註冊</a>
</div>
</header></sc-if>
<sc-if value="{{member}}" hint-placeholder-val="{{ true }}"><header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<div style="display: flex; align-items: center; gap: 56px">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<nav style="display: flex; gap: 36px; font-size: 18px"><a href="Dashboard.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">首頁</a><a href="TechList.dc.html" aria-current="page" style="color: #23262E; text-decoration: none; font-weight: 700; padding-bottom: 6px; border-bottom: 3px solid {{accent}}">找師傅</a><a href="Records.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">維修紀錄</a><a href="Safety.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">我的家</a></nav>
</div>
<div style="display: flex; align-items: center; gap: 16px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a>

<a href="Messages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">林</span><span style="font-size: 16px; font-weight: 500">林小姐</span></a>
</div>
</header></sc-if>
<div style="padding: 40px 80px 0; display: flex; flex-direction: column; gap: 8px"><a href="{{backHref}}" style="font-size: 16px; text-decoration: none">← 回林師傅個人頁</a><div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap"><h1 style="margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">林師傅的評價</h1><span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: #9C3D6B; color: #FFFFFF">女師傅</span><span style="padding: 3px 10px; border-radius: 999px; background: #E4EAF4; color: #26406E; font-size: 14px; font-weight: 700; white-space: nowrap">[N] 次服務</span><span style="padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: #E4F0EA; color: #245443">身分驗證</span><span style="padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: #E4F0EA; color: #245443">良民證</span><span style="padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: #E4F0EA; color: #245443">證照</span><span style="padding: 3px 10px; border-radius: 999px; background: #EEEAE1; color: #4E525C; font-size: 14px; font-weight: 700; white-space: nowrap">國語 · 台語</span></span></div><p style="margin: 0; font-size: 18px; color: #4E525C">只有完成服務的客戶可以評價。評價在雙方都評價後或 7 天後公開，師傅不能刪除評價。</p></div>
<div style="flex-grow: 1; padding: 28px 80px 64px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; align-items: start">
<aside style="grid-column: span 4; padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 26px; font-weight: 900; color: {{denim}}">[N.N]<span style="font-size: 20px; font-weight: 500; color: #62666F"> / 5</span></span>
<span style="font-size: 16px; color: #4E525C">[N] 則評價</span>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><div style="display: flex; align-items: center; gap: 10px; font-size: 16px"><span style="width: 44px; flex-shrink: 0; white-space: nowrap">{{b.s}}</span><span style="flex-grow: 1; height: 8px; border-radius: 4px; background: #ECE7DC"><span style="display: block; height: 8px; border-radius: 4px; width: {{b.w}}; background: {{denim}}"></span></span></div></sc-for>
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; border-top: 1px solid #ECE7DC"><sc-for list="{{tags}}" as="t" hint-placeholder-count="5"><span style="padding: 6px 12px; border-radius: 999px; background: #E4EAF4; color: #26406E; font-size: 14px; font-weight: 500">{{t}}</span></sc-for></div>
</aside>
<section style="grid-column: span 8; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><div style="display: flex; gap: 8px"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: {{t.border}}; background: {{t.bg}}; color: #23262E; font-family: inherit; font-size: 16px; font-weight: {{t.weight}}">{{t.t}}</button></sc-for></div><label style="display: flex; align-items: center; gap: 8px; font-size: 16px; color: #4E525C">排序<select style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E"><option>最新</option><option>分數高到低</option><option>分數低到高</option></select></label></div>
<sc-for list="{{reviews}}" as="r" hint-placeholder-count="4">
<div style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 22px 26px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 12px; font-size: 16px; color: #62666F"><span style="font-weight: 700; color: #23262E">{{r.who}}</span><span>{{r.s}} 分</span><span style="padding: 3px 10px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; font-weight: 700">{{r.k}}</span><span>[日期]</span><sc-if value="{{r.edited}}" hint-placeholder-val="{{ false }}"><span style="color: #62666F">· 已修改</span></sc-if><sc-if value="{{r.mine}}" hint-placeholder-val="{{ false }}"><a href="Summary.dc.html" style="margin-left: auto; font-size: 16px">修改我的評價（30 天內可改一次）</a></sc-if></div>
<p style="margin: 0; font-size: 16px; line-height: 1.8">{{r.t}}</p>
<sc-if value="{{r.hasReply}}" hint-placeholder-val="{{ false }}"><div style="padding: 12px 14px; border-radius: 12px; background: #F6F3EC; font-size: 16px; line-height: 1.7"><strong>林師傅回覆：</strong>[師傅回覆內容]</div></sc-if>
</div>
</sc-for>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"flow":{"editor":"enum","options":["已登入","未登入"],"default":"未登入"},"$preview":{"width":1440,"height":999}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const on = '2px solid ' + denim; const off = '1px solid #D8D2C4';
    const tabs = (names, key) => names.map((t, i) => ({ t: t, pressed: i === this.state[key] ? 'true' : 'false', border: i === this.state[key] ? on : off, bg: i === this.state[key] ? '#E4EAF4' : '#FFFFFF', weight: i === this.state[key] ? '700' : '400', pick: () => this.setState({ [key]: i }) }));
    const guest = (this.props.flow ?? '已登入') === '未登入';
    const v = { k: '視訊', bg: '#E4F0EA', fg: '#245443' };
    const h = { k: '到府', bg: '#F8DCD4', fg: '#8E2E1F' };
    const all = [
      Object.assign({ s: '5', who: '林**（你）', t: '透過鏡頭很快找出原因，說明很清楚，不用讓人進門就知道要不要修。', hasReply: true, mine: !guest, edited: false }, v),
      Object.assign({ s: '5', who: '陳**', t: '準時到，進門前主動念核對碼，施工完還把地板擦乾淨。', hasReply: false }, h),
      Object.assign({ s: '4', who: '王**', t: '很有耐心，但當天零件不夠，要再約一次。', hasReply: true, edited: true }, h),
      Object.assign({ s: '5', who: '張**', t: '報價清楚，說明了修和換新的差別，讓我自己決定。', hasReply: false }, v)
    ];
    const list = this.state.tab === 1 ? all.filter((r) => r.k === '視訊') : this.state.tab === 2 ? all.filter((r) => r.k === '到府') : all;
    return {
      accent: this.props.accent ?? '#C8412C', denim: denim,
      guest: guest, member: !guest,
      backHref: guest ? 'TechGuest.dc.html' : 'Tech.dc.html',
      tabs: tabs(['全部', '視訊', '到府'], 'tab'),
      bars: [{ s: '5 分', w: '78%' }, { s: '4 分', w: '15%' }, { s: '3 分', w: '5%' }, { s: '2 分', w: '1%' }, { s: '1 分', w: '1%' }],
      tags: ['講解清楚', '準時', '很有耐心', '讓人安心', '乾淨整齊'],
      reviews: list
    };
  }
}
</script>
</body>
</html>
