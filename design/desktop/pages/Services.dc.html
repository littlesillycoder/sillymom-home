<style>

body{word-break:keep-all;overflow-wrap:break-word}
p{word-break:normal}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */

<div style="display: flex; flex-direction: column; gap: 14px; max-width: 760px">

<p style="margin: 0; font-size: 18px; line-height: 1.8; color: #4E525C">每個問題都會先由師傅視訊看狀況、找出原因並報價。確定要到府，才需要讓師傅進門。</p>
</div>

<span style="font-size: 18px; font-weight: 700; color: #26406E">找不到你的問題？</span>
<span style="font-size: 16px; line-height: 1.7; color: #4E525C">直接描述給我們，拍張照片，系統會幫你分類並推薦師傅。</span>
<a href="RequestGuest.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">描述我的問題</a>
</div>
</section>

<div style="padding: 0 80px 80px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="12">
<section style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>
</span>
<h2 style="margin: 0; font-size: 24px; font-weight: 900; color: {{denim}}">{{c.t}}</h2>
</div>
<a href="{{c.href}}" style="font-size: 16px; font-weight: 500">{{c.link}} →</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{c.items}}" as="it" hint-placeholder-count="4">
<a href="RequestGuest.dc.html" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #D8D2C4; background: #F6F3EC; display: flex; align-items: center; text-decoration: none; color: #23262E; font-size: 16px">{{it.t}}</a>
</sc-for>
<a href="RequestGuest.dc.html" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px dashed #B9B3A6; display: flex; align-items: center; text-decoration: none; color: #4E525C; font-size: 16px">其他問題</a>
</div>
</section>
</sc-for>
</div>
</div>
</x-dc>
