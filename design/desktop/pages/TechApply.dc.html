<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 申請成為師傅</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 1140px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<div style="display: flex; align-items: center; gap: 56px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<nav style="display: flex; gap: 36px; font-size: 18px"><a href="Main.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">回首頁</a></nav>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<a href="Messages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">林</span><span style="font-size: 16px; font-weight: 500">申請中</span></a>
</div>
</header>
<div style="padding: 40px 80px 0; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">申請成為師傅</h1>
<ol aria-label="申請步驟" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 28px; font-size: 16px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6"><li style="display: flex; align-items: center; gap: 10px; color: {{s.fg}}; font-weight: {{s.weight}}"><span style="width: 30px; height: 30px; border-radius: 50%; background: {{s.bg}}; color: {{s.numFg}}; border: {{s.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 14px">{{s.n}}</span>{{s.t}}</li></sc-for>
</ol>
</div>
<div style="flex-grow: 1; padding: 28px 80px 64px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; align-items: start">
<form style="grid-column: span 8; padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-size: 20px; font-weight: 900; color: {{denim}}">步驟 3：實名認證與良民證（選填）</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.8; color: #4E525C">客戶在你的個人頁會看到「身分驗證」「良民證」「證照」標章。良民證為選填，有提供才會標示。資料只用於審核，不會公開。</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">真實姓名<input type="text" value="[真實姓名]" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">個人頁顯示名稱<input type="text" value="林師傅" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">性別（會顯示在個人頁）<select style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>女</option><option>男</option></select></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">服務地區<select style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>[縣市] · [行政區] 等 [N] 區</option></select></label>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{docs}}" as="d" hint-placeholder-count="3">
<div style="padding: 18px; border-radius: 14px; border: {{d.border}}; background: {{d.bg}}; display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; flex-direction: column; gap: 0"><span style="font-size: 16px; font-weight: 700">{{d.t}}</span><span style="font-size: 13px; color: #62666F">{{d.opt}}</span></span>
<span style="font-size: 13px; line-height: 1.6; color: #4E525C">{{d.b}}</span>
<span style="font-size: 16px; font-weight: 700; color: {{d.stFg}}">{{d.st}}</span>
</div>
</sc-for>
</div>
<label style="display: flex; align-items: flex-start; gap: 12px; font-size: 16px; line-height: 1.7; color: #4E525C"><input type="checkbox" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: {{denim}}"><span>切結書：我聲明所附證件（含良民證，如有提供）皆為真實；如有偽造，願負法律責任，並同意平台立即停權。</span></label>
<div style="display: flex; justify-content: space-between">
<a href="TechApplySteps.dc.html" style="min-height: 50px; padding: 0 20px; display: flex; align-items: center; border-radius: 12px; border: 1px solid #D8D2C4; color: #23262E; text-decoration: none; font-size: 16px">上一步</a>
<a href="TechApplySteps.dc.html" style="min-height: 50px; padding: 0 24px; display: flex; align-items: center; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">下一步：自我介紹影片</a>
</div>
</form>
<aside style="grid-column: span 4; display: flex; flex-direction: column; gap: 20px">
<div style="padding: 24px; border-radius: 20px; background: #E4EAF4; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 18px; font-weight: 700; color: #26406E">平台怎麼收費</span>
<sc-for list="{{rules}}" as="r" hint-placeholder-count="5"><div style="display: flex; gap: 10px; font-size: 16px; line-height: 1.7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>{{r}}</span></div></sc-for>
</div>
<div style="padding: 24px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 18px; font-weight: 700">審核需要多久？</span>
<span style="font-size: 16px; line-height: 1.7; color: #4E525C">資料齊全後約 [N] 個工作天。證照與良民證由平台人工檢視。有提供良民證的話，到期前 30 天會提醒你，逾期只會移除標章，不影響接案。</span>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const names = ['基本資料', '專長與證照', '實名與良民證', '自我介紹影片', '綁定信用卡', '同意師傅條款'];
    const cur = 2;
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      steps: names.map((t, i) => ({ t: t, n: String(i + 1), bg: i < cur ? '#E4F0EA' : (i === cur ? denim : '#FFFFFF'), numFg: i < cur ? '#245443' : (i === cur ? '#FFFFFF' : '#62666F'), ring: i > cur ? '1.5px solid #B9B3A6' : 'none', fg: i === cur ? denim : (i < cur ? '#245443' : '#62666F'), weight: i === cur ? '700' : '400' })),
      docs: [
        { t: '身分證正反面', b: '用來確認你是本人', st: '已上傳', stFg: '#245443', border: '1px solid #E2DDD2', bg: '#F6F3EC' },
        { t: '本人手持身分證照片', b: '與身分證照片比對', st: '已上傳', stFg: '#245443', border: '1px solid #E2DDD2', bg: '#F6F3EC' },
        { t: '警察刑事紀錄證明（良民證）', opt: '（選填）', b: '發證日期一年內的正本掃描，有提供就在個人頁標示', st: '＋ 上傳檔案', stFg: denim, border: '1.5px dashed #B9B3A6', bg: '#FFFFFF' }
      ],
      rules: ['上架審核費 NT$300，審核通過才扣款，只收一次', '平台服務費（視訊）：每次視訊滿 3 分鐘收 NT$150；新師傅第 1 次視訊免費', '視訊結束後 30 分鐘內送出診斷單和報價', '沒拿到這個案子（客戶選了別人或沒有成交）：退抵用金 NT$50', '客戶確認問題已在視訊中解決：退抵用金 NT$100（7 天內同一個問題預約到府，不論哪位師傅，就收回）', '30 分鐘內沒送出報價：沒有抵用金（積分 −2）', '平台服務費（直接預約到府）：核對碼確認時收 NT$150', '出車費和維修費全部歸你，現場直接向客戶收', '視訊缺席（2 小時內取消或遲到超過 5 分鐘）：缺席罰款 NT$100（積分 −5）']
    };
  }
}
</script>
</body>
</html>
