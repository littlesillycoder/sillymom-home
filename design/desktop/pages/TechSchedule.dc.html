<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 案件與排班</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 1440px; height: 1060px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4">
<div style="display: flex; align-items: center; gap: 56px">
<a href="TechHome.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #23262E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span>
<span style="font-size: 20px; font-weight: 900">傻媽萬事通</span>
</a>
<nav style="display: flex; gap: 36px; font-size: 18px"><a href="TechHome.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">今日</a><a href="TechSchedule.dc.html" aria-current="page" style="color: #23262E; text-decoration: none; font-weight: 700; padding-bottom: 6px; border-bottom: 3px solid {{accent}}">案件與排班</a><a href="TechEarnings.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">收入與費用</a><a href="TechProfileEdit.dc.html" style="color: #4E525C; text-decoration: none; padding-bottom: 6px">我的個人頁</a></nav>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<a href="TechMessages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #23262E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></a>
<a href="TechHome.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">林</span><span style="font-size: 16px; font-weight: 500">林師傅</span></a>
</div>
</header>
<div style="padding: 40px 80px 0; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">案件與排班</h1><p style="margin: 0; font-size: 18px; color: #4E525C">點格子設定可接案的時段，每格 30 分鐘。客戶只能預約你開放的時段；已確認的到府會依「預計維修所需時間」自動佔用。</p></div>
<span style="display: flex; gap: 10px"><a href="#" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 12px; border: 1px solid #D8D2C4; color: #23262E; text-decoration: none; font-size: 16px">← 上週</a><a href="#" style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 12px; border: 1px solid #D8D2C4; color: #23262E; text-decoration: none; font-size: 16px">下週 →</a></span>
</div>
<div style="flex-grow: 1; padding: 28px 80px 64px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; align-items: start">
<section style="grid-column: span 8; padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 13px; color: #4E525C; text-align: center">
<span></span><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><span style="font-weight: 700">{{d}}</span></sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr)); gap: 6px">
<span style="font-size: 13px; color: #62666F; display: flex; align-items: center">{{r.time}}</span>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="7"><span style="min-height: 40px; border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; border: {{c.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 13px">{{c.t}}</span></sc-for>
</div>
</sc-for>
<div style="display: flex; gap: 18px; font-size: 13px; color: #4E525C; margin-top: 6px"><span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #3A5A94; border: none; box-sizing: border-box; vertical-align: -1px; margin-right: 6px"></span><span style="color: #3A5A94">可預約</span></span><span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #C8412C; border: none; box-sizing: border-box; vertical-align: -1px; margin-right: 6px"></span><span style="color: #C8412C">已排案件</span></span><span><span style="display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #FFFFFF; border: 1px solid #B9B3A6; box-sizing: border-box; vertical-align: -1px; margin-right: 6px"></span>不接案</span></div>
</section>
<aside style="grid-column: span 4; display: flex; flex-direction: column; gap: 20px">
<div style="padding: 28px 32px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 900; color: {{denim}}">回覆公開求助</h2>
<span style="font-size: 16px; font-weight: 700">冷氣 · 不冷</span>
<span style="font-size: 16px; line-height: 1.6; color: #4E525C">[行政區] · 今天 · 先視訊 · 「開了一小時都不冷，室外機有在轉。」</span>
<div style="height: 96px; border-radius: 12px; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 13px">[客戶附的 2 張照片]</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 700">給客戶的話<textarea rows="3" style="font-family: inherit; font-size: 16px; line-height: 1.6; padding: 12px; border-radius: 10px; border: 1px solid #D8D2C4; background: #F6F3EC; color: #23262E; font-weight: 400; resize: none">看照片像是冷媒不足或濾網太髒，視訊 10 分鐘可以幫你判斷。</textarea></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 700">可以視訊的時間<select style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>今天 19:00 之後</option></select></label>
<a href="TechHome.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">送出回覆（不收費）</a>
</div>
<div style="padding: 18px 20px; border-radius: 16px; background: #E4EAF4; color: #26406E; font-size: 16px; line-height: 1.7">回覆公開求助不收費。</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: {} }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const days = ['一 [日]', '二 [日]', '三 [日]', '四 [日]', '五 [日]', '六 [日]', '日 [日]'];
    const times = ['09:00', '09:30', '10:00', '10:30', '14:00', '14:30', '19:00', '19:30'];
    const booked = { '3-2': '視訊', '5-2': '到府', '6-4': '視訊', '3-5': '到府' };
    const base = (r, c) => (c < 5 && r >= 3) || (c >= 5 && r <= 5);
    const rows = times.map((t, r) => ({ time: t, cells: days.map((d, c) => {
      const k = r + '-' + c; const b = booked[k];
      const avail = this.state.open[k] === undefined ? base(r, c) : this.state.open[k];
      if (b) return { t: b, bg: '#F8DCD4', fg: '#8E2E1F', border: 'none' };
      return avail ? { t: '可約', bg: '#E4EAF4', fg: '#26406E', border: 'none' } : { t: '', bg: '#FFFFFF', fg: '#62666F', border: '1px solid #E2DDD2' };
    }) }));
    return { accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94', days: days, rows: rows };
  }
}
</script>
</body>
</html>
