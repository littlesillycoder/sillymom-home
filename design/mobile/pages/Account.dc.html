<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 帳號設定（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */
[data-vt="1"][data-vt="1"][data-vt="1"][data-vt="1"][data-vt="1"][data-vt="1"]{padding-top:1px!important}
[data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"]{padding-top:11px!important}
[data-vb="3"][data-vb="3"][data-vb="3"][data-vb="3"][data-vb="3"][data-vb="3"]{padding-bottom:3px!important}
[data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"]{padding-bottom:10px!important}
[data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"]{padding-bottom:13px!important}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 16px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4; border-bottom: 1px solid #E2DDD2">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="font-size: 18px; font-weight: 900">傻媽萬事通</span></a>
<span style="display: flex; align-items: center; gap: 8px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a><a href="Menu.dc.html" aria-label="選單" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></span>
</header>
<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 8px"><a data-back href="Safety.dc.html" style="font-size: 16px; text-decoration: none">← 回我的家與安全設定</a><h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">帳號設定</h1><input type="search" aria-label="搜尋設定" placeholder="搜尋設定，例如：通知、發票載具" style="margin-top: 8px; width: 100%; min-height: 40px; height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #23262E"></div>
<div style="flex-grow: 1; padding: 20px 16px 20px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 16px">
<details data-vt="1" data-vb="3" open style="padding: 8px 16px 8px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 14px; gap: 0"><summary style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-size: 18px; font-weight: 900; color: {{denim}}">基本資料<span style="font-size: 14px; font-weight: 400; color: #62666F">⌄</span></summary><div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 12px">
<div data-vt="11" data-vb="10" style="padding: 16px 16px 16px 16px; border-radius: 14px; background: #F6F3EC; display: flex; flex-direction: column; align-items: stretch; gap: 2px"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: nowrap"><span style="font-size: 16px; font-weight: 700">手機號碼</span><a href="SignUp.dc.html" style="font-size: 15px; white-space: nowrap">更換（需簡訊驗證）</a></div><span style="font-size: 16px; color: #245443">+886 [手機號碼] · 已驗證</span></div>
<div data-vt="11" data-vb="10" style="padding: 16px 16px 16px 16px; border-radius: 14px; background: #F6F3EC; display: flex; flex-direction: column; align-items: stretch; gap: 2px"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: nowrap"><span style="font-size: 16px; font-weight: 700">師傅怎麼稱呼你</span><a href="#" style="font-size: 15px; white-space: nowrap">修改</a></div><span style="font-size: 16px; color: #4E525C">林小姐</span></div>
<div data-vt="11" data-vb="10" style="padding: 16px 16px 16px 16px; border-radius: 14px; background: #F6F3EC; display: flex; flex-direction: column; align-items: stretch; gap: 2px"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: nowrap"><span style="font-size: 16px; font-weight: 700">電子發票載具</span><a href="#" style="font-size: 15px; white-space: nowrap">修改</a></div><span style="font-size: 16px; color: #4E525C">手機條碼 /ABC1234</span></div>
</div></details>
<details data-vt="1" style="padding: 8px 16px 8px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 14px; gap: 0"><summary style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-size: 18px; font-weight: 900; color: {{denim}}">通知方式<span style="font-size: 14px; font-weight: 400; color: #62666F">⌄</span></summary><div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 12px">
<sc-for list="{{notify}}" as="n" hint-placeholder-count="2">
<button data-vt="11" type="button" role="switch" aria-checked="{{n.checked}}" onClick="{{n.pick}}" style="padding: 16px 16px 16px 16px; border-radius: 14px; background: #F6F3EC; display: flex; align-items: center; justify-content: space-between; gap: 16px; border: none; font-family: inherit; color: #23262E; text-align: left; width: 100%">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{n.t}}</span><span style="font-size: 16px; color: #4E525C">{{n.b}}</span></span>
<span style="flex-shrink: 0; width: 46px; height: 28px; box-sizing: border-box; border-radius: 14px; padding: 3px 3px 3px 3px; background: {{n.bg}}; display: flex; justify-content: {{n.align}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
</sc-for>
<span style="font-size: 16px; color: #62666F">預約提醒和取消通知一定會送出，不能全部關閉。</span>
</div></details>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<details data-vt="1" style="padding: 8px 16px 8px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 14px; gap: 0"><summary style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-size: 18px; font-weight: 900; color: {{denim}}">我的資料<span style="font-size: 14px; font-weight: 400; color: #62666F">⌄</span></summary><div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 12px">
<div data-vt="11" data-vb="10" style="padding: 16px 16px 16px 16px; border-radius: 14px; background: #F6F3EC; display: flex; flex-direction: column; align-items: stretch; gap: 2px"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: nowrap"><span style="font-size: 16px; font-weight: 700">下載我的資料</span><a href="#" style="font-size: 15px; white-space: nowrap">申請下載</a></div><span style="font-size: 16px; color: #4E525C">維修紀錄、診斷單、評價與付款紀錄</span></div>
<div data-vt="11" data-vb="13" style="padding: 16px 16px 16px 16px; border-radius: 14px; background: #F6F3EC; display: flex; flex-direction: column; align-items: stretch; gap: 2px"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: nowrap"><span style="font-size: 16px; font-weight: 700">登出這個裝置</span><a href="Main.dc.html" style="font-size: 15px; white-space: nowrap">登出</a></div></div>
</div></details>
<details data-vt="1" style="padding: 8px 16px 8px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DDD2; border: 1.5px solid #B42318; display: flex; flex-direction: column; gap: 12px; gap: 0"><summary style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-size: 18px; font-weight: 900; color: {{denim}}">刪除帳號<span style="font-size: 14px; font-weight: 400; color: #62666F">⌄</span></summary><div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 0 12px">

<div style="display: flex; flex-direction: column; gap: 8px"><sc-for list="{{del}}" as="d" hint-placeholder-count="4"><div style="display: flex; gap: 8px; font-size: 15px; line-height: 1.6; color: #23262E; flex-wrap: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>{{d}}</span></div></sc-for></div>
<button type="button" style="align-self: flex-end; min-height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: #B42318; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">刪除我的帳號</button>
</div></details>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { n: [true, true] }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const items = [{ t: 'LINE 通知', b: '已綁定 · 預約提醒、師傅回覆、行程通知' }, { t: '簡訊', b: '沒綁 LINE 時改用簡訊；重要通知 LINE 和簡訊都發' }];
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      notify: items.map((it, i) => { const v = this.state.n[i]; return Object.assign({}, it, { checked: v ? 'true' : 'false', bg: v ? denim : '#B9B3A6', align: v ? 'flex-end' : 'flex-start', pick: () => { const n = this.state.n.slice(); n[i] = !n[i]; this.setState({ n: n }); } }); }),
      del: ['有進行中的預約或申訴時，要先完成或取消才能刪除', '錄影、照片、地址和緊急聯絡人會刪除', '依法需要保存的交易與發票紀錄，會保留 [N] 年後刪除', '刪除後無法復原；違規紀錄會保留，用同一支手機重新註冊時會一併查看']
    };
  }
}
</script>
