<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 公開求助（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */
[data-vt="6"][data-vt="6"][data-vt="6"][data-vt="6"][data-vt="6"][data-vt="6"]{padding-top:6px!important}
[data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"]{padding-top:11px!important}
[data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"]{padding-top:15px!important}
[data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"]{padding-bottom:8px!important}
[data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"]{padding-bottom:9px!important}
[data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"]{padding-bottom:13px!important}
[data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"]{padding-bottom:15px!important}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 390px; height: 1505px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 16px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4; border-bottom: 1px solid #E2DDD2">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="font-size: 18px; font-weight: 900">傻媽萬事通</span></a>
<span style="display: flex; align-items: center; gap: 8px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a><a href="Menu.dc.html" aria-label="選單" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></span>
</header>
<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start">
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">你的求助已公開</h1><p style="margin: 0; font-size: 18px; color: #4E525C">已通知 [N] 位符合條件的師傅。有人回覆時，我們會用簡訊通知你。</p></div>
<span data-vt="11" data-vb="13" style="margin-top: 16px; display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px 16px; border-radius: 999px; background: #E4F0EA; color: #245443; font-size: 16px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2F8A5F"></span>等待回覆中 · 已過 [N] 分鐘</span>
</div>
<div data-vt="15" data-vb="9" style="padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 8px; font-size: 16px; color: #4E525C"><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: nowrap"><span style="white-space: nowrap; padding: 4px 10px 4px 10px; border-radius: 6px; background: #E4EAF4; color: #26406E; font-size: 16px; font-weight: 700">公開內容</span><span style="display: flex; gap: 16px; flex-shrink: 0; font-size: 16px; white-space: nowrap"><a href="Request.dc.html">修改</a><a href="Match.dc.html" style="color: #8E2E1F">取消公開</a></span></div><span>冷氣 · 室內機滴水 · 先視訊 · 今天 · 只要女師傅 · [行政區]</span></div>
</div>
<div style="flex-grow: 1; padding: 20px 16px 20px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start">
<div style="grid-column: auto; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 18px; font-weight: 700">{{count}} 位師傅回覆了</span>
<sc-for list="{{replies}}" as="p" hint-placeholder-count="2"><div data-vb="15" data-keep-pad style="padding: 0 16px 16px; border-radius: 16px; overflow: hidden; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 0"><div style="margin: 0 -16px 12px; padding: 8px 16px; background: {{p.barBg}}; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: nowrap"><span style="display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; font-weight: 700; color: {{p.barFg}}; white-space: nowrap"><sc-if value="{{p.live}}" hint-placeholder-val="{{ true }}"><span style="display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: {{p.barFg}}"></span></sc-if>{{p.barT}}</span><span style="flex-shrink: 0; font-size: 14px; font-weight: 700; color: {{p.barFg}}; white-space: nowrap">{{p.ago}}回覆</span></div><div style="display: flex; gap: 12px; align-items: center; flex-wrap: nowrap"><a href="Tech.dc.html" aria-label="看個人頁" style="flex-shrink: 0; text-decoration: none"><span style="position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900">{{p.i}}</span></a><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px"><span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: nowrap"><span style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0"><a href="Tech.dc.html" style="font-size: 18px; font-weight: 900; white-space: nowrap; color: #23262E; text-decoration: none">{{p.n}}</a><span style="padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: #9C3D6B; color: #FFFFFF">女師傅</span></span><span style="flex-shrink: 0; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: #E4EAF4; color: #26406E">[N] 次服務</span></span><span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: nowrap"><span style="font-size: 14px; color: #62666F; white-space: nowrap">★ [N.N] · [N] 則評價</span></span></span></div><div style="height: 1px; background: #E8E3D8; margin: 12px 0"></div><div style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{p.badges}}" as="bd" hint-placeholder-count="3"><span style="padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: #E4F0EA; color: #245443">{{bd}}</span></sc-for></div><span style="font-size: 15px; line-height: 1.6; color: #4E525C">{{p.s}}</span><span style="font-size: 15px; line-height: 1.6; color: #4E525C">{{p.ct}}</span><div data-vt="6" data-vb="8" style="padding: 12px 14px; border-radius: 12px; background: #F6F3EC; font-size: 16px; line-height: 1.7">「{{p.msg}}」</div><div style="display: flex; gap: 8px; margin-top: 4px; flex-wrap: nowrap"><a href="Tech.dc.html" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: 700; white-space: nowrap; border: 1.5px solid {{denim}}; background: #FFFFFF; color: {{denim}}">看個人頁</a><a href="Checkout.dc.html" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: 700; white-space: nowrap; border: none; background: {{accent}}; color: #FFFFFF">選這位師傅</a></div></div></div></sc-for>
<div style="padding: 20px 16px 20px 16px; border-radius: 20px; border: 1.5px dashed #B9B3A6; text-align: center; font-size: 16px; color: #62666F">更多回覆會出現在這裡</div>
</div>
<aside style="grid-column: auto; padding: 8px 0 0; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 18px; font-weight: 900; color: #23262E; margin-bottom: 4px">公開求助怎麼運作</span>
<sc-for list="{{how}}" as="h" hint-placeholder-count="4"><div style="display: flex; gap: 8px; font-size: 15px; line-height: 1.6; color: #23262E; flex-wrap: nowrap; color: #4E525C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>{{h}}</span></div></sc-for>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":390,"height":1505}}'>
class Component extends DCLogic {
  renderVals() {
    const replies = [
      { i: '周', n: '周師傅', s: '冷氣清洗、保養', ct: '冷凍空調技術士 [N] 年 · 另有 [N] 張證照', badges: ['身分驗證', '良民證', '證照'], ago: '5 分鐘前', msg: '看了你的照片，應該是排水管堵住，視訊 10 分鐘內可以幫你確認原因。', when: '今天 19:00 之後' },
      { i: '吳', n: '吳師傅', s: '冷氣、家電維修', ct: '冷凍空調技術士 [N] 年 · 另有 [N] 張證照', badges: ['身分驗證', '良民證', '證照'], ago: '12 分鐘前', msg: '我現在就可以視訊，也可以安排明天到府。', when: '現在' }
    ];
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      count: String(replies.length),
      replies: replies.map((r) => Object.assign({}, r, { barT: r.when === '現在' ? '在線中・可以馬上視訊' : '可視訊：' + r.when, live: r.when === '現在', barBg: r.when === '現在' ? '#E4F0EA' : '#E4EAF4', barFg: r.when === '現在' ? '#245443' : '#26406E' })),
      how: ['只有通過審核、符合條件的師傅看得到', '師傅只看得到行政區，看不到地址和電話', '最多 [5] 位師傅可以回覆，避免訊息太多', '師傅回覆不收費，你選定後才開始案件', '[N] 小時內沒有人回覆，會自動結束並通知你']
    };
  }
}
</script>
</body>
</html>
