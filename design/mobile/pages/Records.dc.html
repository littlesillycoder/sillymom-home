<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 維修紀錄（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */
[data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"]{padding-top:10px!important}
[data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"]{padding-top:13px!important}
[data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"]{padding-top:15px!important}
[data-vt="16"][data-vt="16"][data-vt="16"][data-vt="16"][data-vt="16"][data-vt="16"]{padding-top:16px!important}
[data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"]{padding-bottom:8px!important}
[data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"]{padding-bottom:15px!important}
[data-vb="16"][data-vb="16"][data-vb="16"][data-vb="16"][data-vb="16"][data-vb="16"]{padding-bottom:16px!important}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 390px; height: 1459px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 16px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4; border-bottom: 1px solid #E2DDD2">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="font-size: 18px; font-weight: 900">傻媽萬事通</span></a>
<span style="display: flex; align-items: center; gap: 8px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a><a href="Menu.dc.html" aria-label="選單" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></span>
</header>
<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start">
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">維修紀錄</h1><p style="margin: 0; font-size: 18px; color: #4E525C">每一次的問題、處理方式、錄影和費用都留在這裡。</p></div>
<div style="display: flex; gap: 8px; margin-top: 16px"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 16px 0 16px; border-radius: 999px; border: {{t.border}}; background: {{t.bg}}; color: #23262E; font-family: inherit; font-size: 16px; font-weight: {{t.weight}}">{{t.t}}</button></sc-for></div>
</div>
<div style="flex-grow: 1; padding: 20px 16px 20px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start">
<div style="grid-column: auto; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{records}}" as="r" hint-placeholder-count="5">
<button data-vt="13" data-vb="8" type="button" aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="padding: 18px 16px 18px 16px; border-radius: 16px; border: {{r.border}}; background: #FFFFFF; font-family: inherit; color: #23262E; text-align: left; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><span style="font-size: 18px; font-weight: 700">{{r.t}}</span><span style="padding: 3px 10px 3px 10px; border-radius: 999px; background: {{r.tagBg}}; color: {{r.tagFg}}; font-size: 14px; font-weight: 700">{{r.kind}}</span></span>
<span style="font-size: 16px; color: #62666F">{{r.b}}</span>
</button>
</sc-for>
</div>
<section data-vt="15" data-vb="15" style="grid-column: auto; padding: 20px 16px 20px 16px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 16px; color: #62666F">{{cur.date}} · {{cur.kind}}</span><h2 style="margin: 0; font-size: 20px; font-weight: 900; color: {{denim}}">{{cur.t}}</h2></div>
<a href="Tech.dc.html" style="flex-shrink: 0; min-height: 44px; padding: 0 16px 0 16px; display: flex; align-items: center; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">再找{{cur.tech}}</a>
</div>
<div data-vt="16" data-vb="16" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px 14px 16px; border-radius: 14px; background: #F6F3EC">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900">{{cur.i}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{cur.tech}}</span><span style="font-size: 13px; color: #62666F">已通過平台審核</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="align-self: flex-start; padding: 4px 10px 4px 10px; border-radius: 6px; background: #E4EAF4; color: #26406E; font-size: 16px; font-weight: 700">師傅的診斷單</span>
<sc-for list="{{cur.summary}}" as="s" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #ECE7DC"><span style="font-size: 16px; font-weight: 700; color: #4E525C">{{s.k}}</span><span style="grid-column: auto; font-size: 16px; line-height: 1.7">{{s.v}}</span></div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px">
<div style="padding: 16px 16px 16px 16px; border-radius: 14px; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: nowrap"><span style="font-size: 16px; font-weight: 700">視訊錄影</span><span style="display: flex; gap: 16px; font-size: 15px; white-space: nowrap"><a href="Recording.dc.html">播放</a><a href="Recording.dc.html">刪除</a></span></div><span style="font-size: 15px; color: #4E525C">保存到 [日期]</span></div>
<div style="padding: 16px 16px 16px 16px; border-radius: 14px; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: nowrap"><span style="font-size: 16px; font-weight: 700">費用</span><a href="Recording.dc.html" style="font-size: 15px; white-space: nowrap">電子發票</a></div><sc-for list="{{cur.fees}}" as="x" hint-placeholder-count="3"><span style="display: flex; justify-content: space-between; gap: 10px; font-size: 16px; color: #4E525C"><span>{{x.k}}</span><span style="font-weight: 700; color: #23262E">{{x.v}}</span></span></sc-for></div>
</div>
<div data-vt="10" data-vb="8" style="padding: 14px 16px 14px 16px; border-radius: 14px; background: #E4F0EA; color: #245443; font-size: 16px; line-height: 1.7; display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><div style="align-self: stretch; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: nowrap"><strong>保養提醒</strong><a href="Account.dc.html" style="color: #245443; font-weight: 700; font-size: 15px; white-space: nowrap">修改提醒</a></div><span>建議 [N] 個月後清洗濾網，到時候會通知你。</span></div>
<div style="display: flex; gap: 8px; flex-wrap: nowrap"><a href="Report.dc.html" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #EEEAE1; color: #23262E; text-decoration: none; font-size: 15px; font-weight: 700">回報給平台</a><a href="Favorites.dc.html" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #EEEAE1; color: #23262E; text-decoration: none; font-size: 15px; font-weight: 700">封鎖這位師傅</a></div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":390,"height":1459}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0, sel: 0 }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const on = '2px solid ' + denim; const off = '1px solid #D8D2C4';
    const tabs = (names, key) => names.map((t, i) => ({ t: t, pressed: i === this.state[key] ? 'true' : 'false', border: i === this.state[key] ? on : off, bg: i === this.state[key] ? '#E4EAF4' : '#FFFFFF', weight: i === this.state[key] ? '700' : '400', pick: () => this.setState({ [key]: i }) }));
    const all = [
      { t: '冷氣室內機滴水', kind: '視訊診斷估價', tech: '林師傅', i: '林', date: '[日期]', b: '[日期] · 林師傅 · 視訊 [N] 分鐘', fees: [{ k: '平台費（求助）', v: 'NT$100' }], summary: [{ k: '原因', v: '排水口附近積灰，造成排水不順。' }, { k: '建議', v: '依說明書清洗濾網即可。' }, { k: '保固與提醒', v: '若清洗後仍滴水，可能是排水管破損，再預約到府。' }] },
      { t: '洗衣機排水異常', kind: '視訊診斷估價＋到府維修', tech: '黃師傅', i: '黃', date: '[日期]', b: '[日期] · 黃師傅 · 到府', fees: [{ k: '平台費（求助）', v: 'NT$100' }, { k: '出車費（付給師傅）', v: '[NT$XXX]' }, { k: '維修費（付給師傅）', v: '[NT$XXX]' }], summary: [{ k: '原因', v: '排水馬達卡異物。' }, { k: '處理', v: '到府拆下馬達清除異物，測試正常。' }, { k: '保固與提醒', v: '黃師傅提供保固 [N] 天。' }] },
      { t: '浴室水龍頭滴水', kind: '視訊診斷估價', tech: '陳師傅', i: '陳', date: '[日期]', b: '[日期] · 陳師傅 · 視訊 [N] 分鐘', fees: [{ k: '平台費（求助）', v: 'NT$100' }], summary: [{ k: '原因', v: '水龍頭內墊片老化。' }, { k: '建議', v: '建議到府更換墊片，報價 [NT$XXX]。' }, { k: '保固與提醒', v: '你決定暫時不預約。' }] },
      { t: '客廳燈具更換', kind: '直接預約到府', tech: '張師傅', i: '張', date: '[日期]', b: '[日期] · 張師傅 · 到府', fees: [{ k: '平台費（直接預約到府）', v: 'NT$100' }, { k: '逾時費（臨時改期）', v: 'NT$50' }, { k: '出車費（付給師傅）', v: '[NT$XXX]' }, { k: '維修費（付給師傅）', v: '[NT$XXX]' }], summary: [{ k: '原因', v: '舊燈具故障。' }, { k: '處理', v: '更換新燈具並檢查線路。' }, { k: '保固與提醒', v: '張師傅提供保固 [N] 天。' }] }
    ];
    const list = this.state.tab === 1 ? all.filter((r) => r.kind.indexOf('視訊') >= 0) : this.state.tab === 2 ? all.filter((r) => r.kind.indexOf('到府') >= 0) : all;
    const sel = Math.min(this.state.sel, list.length - 1);
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      tabs: tabs(['全部', '視訊', '到府'], 'tab'),
      records: list.map((r, i) => Object.assign({}, r, { pressed: i === sel ? 'true' : 'false', border: i === sel ? on : '1px solid #E2DDD2', tagBg: r.kind.indexOf('到府') >= 0 ? '#F8DCD4' : '#E4F0EA', tagFg: r.kind.indexOf('到府') >= 0 ? '#8E2E1F' : '#245443', pick: () => this.setState({ sel: i }) })),
      cur: list[sel]
    };
  }
}
</script>
</body>
</html>
