<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 求助表單（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- m-fixed -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}
/* 固定在底部的按鈕區：依狀態出現的按鈕一律直排、滿版 */
[data-mrow] > div{flex-direction:column!important;gap:8px!important;flex-wrap:nowrap!important}
[data-mrow] a,[data-mrow] button{width:100%;min-height:48px!important;justify-content:center}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */
[data-vt="9"][data-vt="9"][data-vt="9"][data-vt="9"][data-vt="9"][data-vt="9"]{padding-top:9px!important}
[data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"]{padding-top:10px!important}
[data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"]{padding-top:11px!important}
[data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"]{padding-top:15px!important}
[data-vb="4"][data-vb="4"][data-vb="4"][data-vb="4"][data-vb="4"][data-vb="4"]{padding-bottom:4px!important}
[data-vb="5"][data-vb="5"][data-vb="5"][data-vb="5"][data-vb="5"][data-vb="5"]{padding-bottom:5px!important}
[data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"]{padding-bottom:8px!important}
[data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"]{padding-bottom:9px!important}
[data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"]{padding-bottom:15px!important}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 16px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4; border-bottom: 1px solid #E2DDD2">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="font-size: 18px; font-weight: 900">傻媽萬事通</span></a>
<span style="display: flex; align-items: center; gap: 8px"><a href="MenuGuest.dc.html" aria-label="選單" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></span>
</header>
<div data-mscroll style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column">

<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 16px">
<div aria-label="求助步驟" style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 18px; font-weight: 900; color: {{denim}}; white-space: nowrap">描述問題</span><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: nowrap; font-size: 14px; color: #62666F"><span style="white-space: nowrap">步驟 1／3</span><span style="white-space: nowrap">下一步：推薦師傅</span></div><div style="height: 6px; border-radius: 3px; background: #E2DDD2; overflow: hidden"><span style="display: block; height: 6px; width: 33%; background: {{denim}}"></span></div></div>
<h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">告訴我們發生了什麼事</h1>
</div>

<div style="flex-grow: 1; padding: 20px 16px 20px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start">
<form style="grid-column: auto; display: flex; flex-direction: column; gap: 16px">

<fieldset data-vt="10" data-vb="15" style="margin: 0; padding: 20px 16px 20px 16px; border: 1px solid #E2DDD2; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<legend style="float: left; width: 100%; padding: 0 0 0 0; margin: 0; font-size: 18px; font-weight: 700">哪一類的問題？</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<button type="button" aria-pressed="{{c.on}}" style="min-height: 52px; border-radius: 12px; border: {{c.border}}; background: {{c.bg}}; color: #23262E; font-family: inherit; font-size: 16px; font-weight: {{c.weight}}">{{c.t}}</button>
</sc-for>
</div>
</fieldset>

<fieldset data-vt="15" data-vb="15" style="margin: 0; padding: 20px 16px 20px 16px; border: 1px solid #E2DDD2; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<legend style="float: left; width: 100%; padding: 0 0 0 0; margin: 0; font-size: 18px; font-weight: 700">描述一下狀況<span style="margin-left: 8px; padding: 2px 10px 2px 10px; border-radius: 999px; background: #FBE3DE; color: #8E2E1F; font-size: 14px; font-weight: 700; vertical-align: 3px">必填</span></legend>
<label for="desc" style="font-size: 16px; color: #4E525C">什麼時候開始、有什麼聲音或味道、你試過什麼，寫越多師傅越好判斷</label>
<textarea id="desc" rows="4" style="font-family: inherit; font-size: 16px; line-height: 1.8; padding: 16px 16px 16px 16px; border: 1px solid #D8D2C4; border-radius: 14px; background: #F6F3EC; color: #23262E; resize: none">客廳冷氣室內機這兩天一直滴水，滴在地板上。開冷氣大概半小時後開始滴，遙控器顯示正常。上個月才清洗過濾網。</textarea>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 16px; color: #4E525C">照片或短影片（選填，最多 5 個）</span>
<button type="button" style="min-height: 64px; border-radius: 12px; border: 1.5px solid {{denim}}; background: #FFFFFF; color: {{denim}}; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 10a3.5 3.5 0 110 7 3.5 3.5 0 010-7"></path></svg>拍照或錄影</button>
<div style="display: flex; gap: 12px">
<div style="width: 88px; height: 88px; border-radius: 12px; background: #E4EAF4; color: #26406E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6"></path></svg>
[照片 1]</div>
<div style="width: 88px; height: 88px; border-radius: 12px; background: #E4EAF4; color: #26406E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h12v12H3zM15 10l6-3v10l-6-3z"></path></svg>
[影片 0:12]</div>
<button type="button" style="width: 88px; height: 88px; border-radius: 12px; border: 1.5px dashed #B9B3A6; background: #F6F3EC; color: #4E525C; font-family: inherit; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
從相簿選</button>
</div>
</div>
</fieldset>

<fieldset data-vt="10" data-vb="4" style="margin: 0; padding: 20px 16px 20px 16px; border: 1px solid #E2DDD2; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
<legend style="float: left; width: 100%; padding: 0 0 0 0; margin: 0; font-size: 18px; font-weight: 700">你希望怎麼處理？</legend>
<div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px">
<button data-vt="9" data-vb="5" type="button" aria-pressed="true" style="min-height: 96px; padding: 18px 16px 18px 16px; border-radius: 14px; border: 2px solid {{denim}}; background: #E4EAF4; color: #23262E; font-family: inherit; text-align: left; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 18px; font-weight: 700">先視訊看看</span>
<span style="font-size: 16px; color: #4E525C">不用讓人進門，先知道原因和報價</span>
</button>
<button data-vt="10" data-vb="9" type="button" aria-pressed="false" style="min-height: 96px; padding: 18px 16px 18px 16px; border-radius: 14px; border: 1px solid #D8D2C4; background: #FFFFFF; color: #23262E; font-family: inherit; text-align: left; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 18px; font-weight: 700">直接安排到府</span>
<span style="font-size: 16px; color: #4E525C">需要填寫行政區，完整地址預約確認後才提供</span>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 16px; color: #4E525C">什麼時候需要？</span>
<div style="display: flex; gap: 6px; flex-wrap: nowrap">
<button type="button" aria-pressed="true" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 2px solid {{denim}}; background: #E4EAF4; color: #23262E; font-family: inherit; font-size: 16px; font-weight: 700">現在</button>
<button type="button" aria-pressed="false" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #D8D2C4; background: #FFFFFF; color: #23262E; font-family: inherit; font-size: 16px">今天稍晚</button>
<button type="button" aria-pressed="false" style="min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #D8D2C4; background: #FFFFFF; color: #23262E; font-family: inherit; font-size: 16px">指定日期時間</button>
</div>
</div>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 500"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: {{denim}}">只要女師傅</label>
</fieldset>
</form>

<aside style="display: flex; flex-direction: column; gap: 16px">

<div data-vt="11" data-vb="8" style="padding: 20px 16px 20px 16px; border-radius: 20px; background: #E4EAF4; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 18px; font-weight: 700; color: #26406E; margin-bottom: 12px">你的資料怎麼被保護</span>
<sc-for list="{{privacy}}" as="p" hint-placeholder-count="3">
<div style="display: flex; gap: 8px; font-size: 16px; line-height: 1.7; color: #23262E; margin-top: -12px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 6px"><path d="M5 12l5 5L20 7"></path></svg>
<span>{{p}}</span>
</div>
</sc-for>
</div>


<ul style="margin: 0; padding: 0 0 0 0; list-style: none; display: flex; flex-direction: column; gap: 2px"><li style="display: flex; gap: 8px; font-size: 16px; line-height: 1.7; color: #62666F; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>送出不會收費。</span></li><li style="display: flex; gap: 8px; font-size: 16px; line-height: 1.7; color: #62666F; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>先視訊：平台費（求助）<strong style="white-space: nowrap">NT$100</strong> 含 2 次視訊，求助結束後才扣款。</span></li><li style="display: flex; gap: 8px; font-size: 16px; line-height: 1.7; color: #62666F; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>直接預約到府：平台費（直接預約到府）<strong style="white-space: nowrap">NT$100</strong>，核對碼確認後才扣款。</span></li></ul>
</aside>
</div>
</div>
<div data-mbar style="flex-shrink: 0; padding: 12px 16px 24px; background: #FFFFFF; box-shadow: 0 -4px 16px rgba(35,38,46,0.10); display: flex; flex-direction: column; gap: 8px">
<a href="Match.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 16px; font-weight: 700; border: none; background: {{accent}}; color: #FFFFFF">送出，幫我找師傅</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const names = ['水電與漏水', '冷氣', '家電', '燈具與插座', '門鎖', '3C 與網路', '智慧家電與監視器', '油漆與小裝修', '除蟲', '家具組裝', '居家小修繕', '不確定是哪一類'];
    return {
      accent: this.props.accent ?? '#C8412C',
      denim: denim,
      cats: names.map((t) => ({
        t: t,
        on: t === '冷氣' ? 'true' : 'false',
        border: t === '冷氣' ? '2px solid ' + denim : '1px solid #D8D2C4',
        bg: t === '冷氣' ? '#E4EAF4' : '#FFFFFF',
        weight: t === '冷氣' ? '700' : '400'
      })),
      privacy: [
        '只有通過審核的師傅看得到你的求助',
        '師傅只看得到行政區，看不到你的完整地址',
        '照片和影片只用於這次維修和你的維修紀錄，可以自行刪除'
      ]
    };
  }
}
</script>
