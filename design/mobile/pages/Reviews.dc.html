<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 師傅評價（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */
[data-vt="8"][data-vt="8"][data-vt="8"][data-vt="8"][data-vt="8"][data-vt="8"]{padding-top:8px!important}
[data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"]{padding-top:10px!important}
[data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"]{padding-top:15px!important}
[data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"]{padding-bottom:10px!important}
[data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"]{padding-bottom:15px!important}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 390px; height: 1349px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<sc-if value="{{guest}}" hint-placeholder-val="{{ false }}"><header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 16px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4; border-bottom: 1px solid #E2DDD2">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="font-size: 18px; font-weight: 900">傻媽萬事通</span></a>
<span style="display: flex; align-items: center; gap: 8px"><a href="Login.dc.html" style="min-height: 36px; padding: 0 14px 0 14px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center">免費註冊</a><a href="MenuGuest.dc.html" aria-label="選單" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></span>
</header></sc-if>
<sc-if value="{{member}}" hint-placeholder-val="{{ true }}"><header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 16px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4; border-bottom: 1px solid #E2DDD2">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="font-size: 18px; font-weight: 900">傻媽萬事通</span></a>
<span style="display: flex; align-items: center; gap: 8px"><a href="Notifications.dc.html" aria-label="通知" style="width: 44px; height: 44px; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"></path></svg><span style="position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a><a href="Menu.dc.html" aria-label="選單" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></span>
</header></sc-if>
<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 8px"><a data-back href="{{backHref}}" style="font-size: 16px; text-decoration: none">← 回林師傅個人頁</a><h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">林師傅的評價</h1><p style="margin: 0; font-size: 18px; color: #4E525C">只有完成服務的客戶可以評價。評價在雙方都評價後或 7 天後公開，師傅不能刪除評價。</p></div>
<div style="flex-grow: 1; padding: 20px 16px 20px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start">
<aside data-keep-pad style="grid-column: auto; padding: 0 16px 16px; border-radius: 16px; overflow: hidden; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 12px">
<div style="margin: 0 -16px 4px; padding: 10px 16px; background: #FDF3D7; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: nowrap"><span style="font-size: 18px; font-weight: 700; color: #6B4A00; white-space: nowrap">★ [N.N] <span style="font-size: 15px; font-weight: 400">/ 5</span></span><span style="font-size: 14px; font-weight: 700; color: #6B4A00; white-space: nowrap">[N] 則評價</span></div>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><div style="display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="width: 40px; flex-shrink: 0; white-space: nowrap">{{b.s}}</span><span style="flex-grow: 1; height: 8px; border-radius: 4px; background: #ECE7DC"><span style="display: block; height: 8px; border-radius: 4px; width: {{b.w}}; background: {{denim}}"></span></span></div></sc-for>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding-top: 12px; border-top: 1px solid #ECE7DC"><sc-for list="{{tags}}" as="t" hint-placeholder-count="5"><span style="padding: 6px 12px 6px 12px; border-radius: 999px; background: #E4EAF4; color: #26406E; font-size: 14px; font-weight: 500">{{t}}</span></sc-for></div>
</aside>
<section style="grid-column: auto; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap"><div style="display: flex; gap: 6px; flex-wrap: nowrap"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: {{t.border}}; background: {{t.bg}}; color: #23262E; font-family: inherit; font-size: 15px; font-weight: {{t.weight}}; white-space: nowrap">{{t.t}}</button></sc-for></div><label aria-label="排序" style="display: flex; align-items: center; font-size: 16px; color: #4E525C; flex-shrink: 0"><select style="min-height: 44px; padding: 0 12px 0 12px; border-radius: 10px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E"><option>最新</option><option>分數高到低</option><option>分數低到高</option></select></label></div>
<sc-for list="{{reviews}}" as="r" hint-placeholder-count="4">
<div data-vt="15" data-vb="15" style="padding: 20px 16px 20px 16px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; padding: 20px 16px 20px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; font-size: 16px; color: #62666F; white-space: nowrap"><span style="font-weight: 700; color: #23262E">{{r.who}}</span><span>{{r.s}} 分</span><span style="padding: 3px 10px 3px 10px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; font-weight: 700">{{r.k}}</span><span>[日期]</span><sc-if value="{{r.edited}}" hint-placeholder-val="{{ false }}"><span style="color: #62666F">· 已修改</span></sc-if><sc-if value="{{r.mine}}" hint-placeholder-val="{{ false }}"><a href="Summary.dc.html" style="margin-left: auto; font-size: 16px">修改我的評價（30 天內可改一次）</a></sc-if></div>
<p style="margin: 0; font-size: 16px; line-height: 1.8">{{r.t}}</p>
<sc-if value="{{r.hasReply}}" hint-placeholder-val="{{ false }}"><div data-vt="10" data-vb="10" style="padding: 12px 14px 12px 14px; border-radius: 12px; background: #F6F3EC; font-size: 16px; line-height: 1.7"><strong>林師傅回覆：</strong>[師傅回覆內容]</div></sc-if>
</div>
</sc-for>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"flow":{"editor":"enum","options":["已登入","未登入"],"default":"未登入"},"$preview":{"width":390,"height":1349}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const on = '2px solid ' + denim; const off = '1px solid #D8D2C4';
    const tabs = (names, key) => names.map((t, i) => ({ t: t, pressed: i === this.state[key] ? 'true' : 'false', border: i === this.state[key] ? on : off, bg: i === this.state[key] ? '#E4EAF4' : '#FFFFFF', weight: i === this.state[key] ? '700' : '400', pick: () => this.setState({ [key]: i }) }));
    const guest = (this.props.flow ?? '已登入') === '未登入';
    const v = { k: '視訊', bg: '#E4F0EA', fg: '#245443' };
    const h = { k: '到府', bg: '#F8DCD4', fg: '#8E2E1F' };
    const all = [
      Object.assign({ s: '5', who: '林**（你）', t: '透過鏡頭很快找出原因，說明很清楚，不用讓人進門就知道要不要修。', hasReply: true, mine: !guest, edited: false }, v),
      Object.assign({ s: '5', who: '陳**', t: '準時到，進門前主動念核對碼，施工完還把地板擦乾淨。', hasReply: false }, h),
      Object.assign({ s: '4', who: '王**', t: '很有耐心，但當天零件不夠，要再約一次。', hasReply: true, edited: true }, h),
      Object.assign({ s: '5', who: '張**', t: '報價清楚，說明了修和換新的差別，讓我自己決定。', hasReply: false }, v)
    ];
    const list = this.state.tab === 1 ? all.filter((r) => r.k === '視訊') : this.state.tab === 2 ? all.filter((r) => r.k === '到府') : all;
    return {
      accent: this.props.accent ?? '#C8412C', denim: denim,
      guest: guest, member: !guest,
      backHref: guest ? 'TechGuest.dc.html' : 'Tech.dc.html',
      tabs: tabs(['全部', '視訊', '到府'], 'tab'),
      bars: [{ s: '5 分', w: '78%' }, { s: '4 分', w: '15%' }, { s: '3 分', w: '5%' }, { s: '2 分', w: '1%' }, { s: '1 分', w: '1%' }],
      tags: ['講解清楚', '準時', '很有耐心', '讓人安心', '乾淨整齊'],
      reviews: list
    };
  }
}
</script>
</body>
</html>
