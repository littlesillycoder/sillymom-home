<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 診斷單（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */
[data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"]{padding-top:11px!important}
[data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"]{padding-top:13px!important}
[data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"]{padding-top:15px!important}
[data-vb="7"][data-vb="7"][data-vb="7"][data-vb="7"][data-vb="7"][data-vb="7"]{padding-bottom:7px!important}
[data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"]{padding-bottom:8px!important}
[data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"]{padding-bottom:9px!important}
[data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"]{padding-bottom:13px!important}
[data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"]{padding-bottom:15px!important}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 390px; height: 2143px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F3EC; font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 16px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4; border-bottom: 1px solid #E2DDD2"><a href="TechHome.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="font-size: 18px; font-weight: 900">傻媽萬事通</span><span style="padding: 2px 8px; border-radius: 999px; background: {{denim}}; color: #FFFFFF; font-size: 13px; font-weight: 700">師傅</span></a><span style="display: flex; align-items: center; gap: 8px"><a href="TechMessages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span style="position: absolute; top: 8px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a><a href="TechMenu.dc.html" aria-label="選單" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></span></header>
<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 8px"><a data-back href="TechVideo.dc.html" style="font-size: 16px; text-decoration: none">← 回視訊</a><h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">診斷單</h1><p style="margin: 0; font-size: 18px; color: #4E525C">林小姐 · 冷氣室內機滴水 · 視訊 [N] 分鐘。送出後客戶會收到通知，在諮詢結束頁看到。</p><div style="align-self: flex-start; margin-top: 6px; padding: 10px 16px; border-radius: 12px; background: #FDF3D7; color: #6B4A00; display: flex; align-items: baseline; gap: 10px"><span style="font-size: 16px; font-weight: 700">送出期限</span><span style="font-size: 20px; font-weight: 900; color: #B42318">剩 [18] 分鐘</span><span style="font-size: 16px">越快送出，客戶越可能選你；逾時沒送出就沒有抵用金<span style="margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: #F8DCD4; color: #B42318; font-size: 14px; font-weight: 700; white-space: nowrap">−2 分</span></span></div></div>
<div style="flex-grow: 1; padding: 16px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start">
<form style="grid-column: auto; padding: 16px 16px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">類別（必選）<select style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>冷氣</option><option>水電與漏水</option><option>家電</option></select></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">子項目（必選）<select style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>室內機滴水</option><option>冷氣不冷</option></select></label></div>
<span style="margin-top: -10px; font-size: 13px; line-height: 1.6; color: #62666F">客戶選「不確定是哪一類」時，請依實際狀況選擇。</span>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">問題原因（必填）<textarea rows="3" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400; padding: 12px 14px; line-height: 1.7; resize: none">排水管靠近室外機的接頭疑似破損，室內機積水後從右下角滴出。</textarea></label>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 16px; font-weight: 700">建議（必選）</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{advice}}" as="c" hint-placeholder-count="5"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: {{c.border}}; background: {{c.bg}}; color: #23262E; font-family: inherit; font-size: 16px; font-weight: {{c.weight}}">{{c.t}}</button></sc-for></div></div>
<sc-if value="{{quote}}" hint-placeholder-val="{{ true }}">
<div style="padding: 18px; border-radius: 14px; background: #F6F3EC; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 16px; font-weight: 700">{{quoteTitle}}</span>
<div style="display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700"><span>出車費（固定，來自<a href="TechProfileEdit.dc.html">個人頁</a>）</span><input type="text" value="NT$[XXX]" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400; background: #EEEAE1"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">{{repairLabel}}<input type="text" value="{{repairValue}}" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">保固天數（由你提供並負責）<input type="text" value="[N] 天" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700"><span>預計維修所需時間（會佔用你的<a href="TechSchedule.dc.html">排班</a>）</span><select style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>約 1 小時</option><option>約 1.5 小時</option><option>約 2 小時</option></select></label>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">備註（材料寫在這裡，不另外標價）<input type="text" value="更換排水管一條" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"></label>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{presets}}" as="p" hint-placeholder-count="3"><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px dashed #B9B3A6; background: #FFFFFF; color: #23262E; font-family: inherit; font-size: 14px">＋ {{p}}</button></sc-for></div>
<span style="font-size: 13px; color: #8E2E1F">出車費越高，客戶下單意願越低。</span>
</div>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">給客戶的話（選填）<input type="text" placeholder="例如：先不要開冷氣，避免繼續積水" style="min-height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"></label>
<label style="display: flex; align-items: flex-start; gap: 12px; font-size: 16px; line-height: 1.7; color: #4E525C"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: {{denim}}"><span>這次視訊我沒有指導客戶拆裝，或碰觸電線、瓦斯。</span></label>
<div style="display: flex; justify-content: flex-end; gap: 12px"><a href="TechVideo.dc.html" style="min-height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1.5px solid {{denim}}; background: #FFFFFF; color: {{denim}}; text-decoration: none; font-size: 16px; font-family: inherit">回視訊</a><a href="TechHome.dc.html" style="min-height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700; border: none; font-family: inherit">送出診斷單</a></div>
</form>
<aside style="grid-column: auto; padding: 16px; border-radius: 20px; background: #E4EAF4; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 18px; font-weight: 700; color: #26406E">填寫提醒</span>
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4"><div style="display: flex; gap: 10px; font-size: 16px; line-height: 1.7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#245443" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 4px"><path d="M5 12l5 5L20 7"></path></svg><span>{{n}}</span></div></sc-for>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":390,"height":2143}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { adv: 1 }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const on = '2px solid ' + denim; const off = '1px solid #D8D2C4';
    const pick = (names, key) => names.map((t, i) => ({ t: t, pressed: i === this.state[key] ? 'true' : 'false', border: i === this.state[key] ? on : off, bg: i === this.state[key] ? '#E4EAF4' : '#FFFFFF', weight: i === this.state[key] ? '700' : '400', pick: () => this.setState({ [key]: i }) }));
    const multi = (names, key) => names.map((t, i) => { const v = this.state[key][i]; return { t: t, pressed: v ? 'true' : 'false', border: v ? on : off, bg: v ? '#E4EAF4' : '#FFFFFF', weight: v ? '700' : '400', pick: () => { const a = this.state[key].slice(); a[i] = !a[i]; this.setState({ [key]: a }); } }; });
    const a = this.state.adv + 1;
    return {
      accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94',
      advice: pick(['問題已在視訊中解決', '到府維修', '需到府檢查才能報價', '建議換新'], 'adv'),
      quote: a === 2 || a === 3,
      quoteTitle: a === 3 ? '到府檢查的估價範圍' : '到府報價',
      repairLabel: a === 3 ? '維修費估價範圍（含材料）' : '維修費（含工資與材料，總價）',
      repairValue: a === 3 ? 'NT$[XXX] – NT$[XXX]' : 'NT$[XXX]',
      presets: ['材料由我準備', '可開立收據'],
      notes: ['類別、原因和建議是必填，內容由你負責', '問題在視訊中就解決了，請選「問題已在視訊中解決」；客戶確認後你得到抵用金 NT$100', '報價只分出車費和維修費，材料寫在備註', '到府要照這份報價施工；現場加價必須經客戶同意', '預計維修所需時間會在客戶預約時，自動佔用你的排班', '「需到府檢查」請填估價範圍']
    };
  }
}
</script>
</body>
</html>
