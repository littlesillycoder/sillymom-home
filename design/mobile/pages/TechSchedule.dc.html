<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */
[data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"][data-vt="11"]{padding-top:11px!important}
[data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"][data-vt="13"]{padding-top:13px!important}
[data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"][data-vt="15"]{padding-top:15px!important}
[data-vb="7"][data-vb="7"][data-vb="7"][data-vb="7"][data-vb="7"][data-vb="7"]{padding-bottom:7px!important}
[data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"][data-vb="8"]{padding-bottom:8px!important}
[data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"][data-vb="9"]{padding-bottom:9px!important}
[data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"][data-vb="13"]{padding-bottom:13px!important}
[data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"][data-vb="15"]{padding-bottom:15px!important}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px 0 16px; display: flex; align-items: center; justify-content: space-between; background: #E4EAF4; border-bottom: 1px solid #E2DDD2"><a href="TechHome.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #23262E"><span style="width: 34px; height: 34px; border-radius: 10px; background: {{denim}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"></path></svg></span><span style="font-size: 18px; font-weight: 900">傻媽萬事通</span><span style="padding: 2px 8px; border-radius: 999px; background: {{denim}}; color: #FFFFFF; font-size: 13px; font-weight: 700">師傅</span></a><span style="display: flex; align-items: center; gap: 8px"><a href="TechMessages.dc.html" aria-label="訊息" style="width: 44px; height: 44px; color: #23262E; display: flex; align-items: center; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span style="position: absolute; top: 8px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: #C8412C"></span></a><a href="TechMenu.dc.html" aria-label="選單" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a></span></header>
<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 0.02em; color: {{denim}}">案件與排班</h1><span style="font-size: 15px; line-height: 1.6; color: #4E525C">點時段設定可以接案的時間，每格 30 分鐘。已確認的到府會依「預計維修所需時間」自動佔用。</span></div><div style="flex-grow: 1; padding: 20px 16px 20px 16px; display: flex; flex-direction: column; gap: 16px"><section style="padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 8px; gap: 14px"><div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 900; color: {{denim}}">{{dayTitle}}</h2><span style="font-size: 15px; color: #4E525C">開放 {{openN}} 格</span></div><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="min-height: 52px; padding: 0; border-radius: 12px; border: {{d.border}}; background: {{d.bg}}; color: #23262E; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0"><span style="font-size: 13px; color: #62666F">{{d.w}}</span><span style="font-size: 15px; font-weight: {{d.weight}}">{{d.n}}</span><span style="width: 6px; height: 6px; border-radius: 50%; background: {{d.dot}}"></span></button></sc-for></div><div style="display: flex; gap: 14px; font-size: 14px; color: #4E525C"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #E4EAF4; border: 1.5px solid {{denim}}"></span>可預約</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: {{denim}}"></span>已排案件</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FFFFFF; border: 1px solid #D8D2C4"></span>不接案</span></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{slots}}" as="s" hint-placeholder-count="24"><button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="min-height: 44px; padding: 0 6px; border-radius: 12px; border: {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-family: inherit; font-size: 15px; font-weight: {{s.weight}}; display: flex; align-items: center; justify-content: center; gap: 6px">{{s.t}}<span style="font-size: 13px">{{s.note}}</span></button></sc-for></div><div style="display: flex; gap: 8px"><button type="button" onClick="{{allOn}}" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 15px; font-weight: 700; border: 1.5px solid {{denim}}; background: #FFFFFF; color: {{denim}}">這天全部開放</button><button type="button" onClick="{{allOff}}" style="flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 15px; font-weight: 700; border: none; background: #EEEAE1; color: #23262E">這天休息</button></div><span style="font-size: 14px; line-height: 1.6; color: #62666F">已排的案件不能關閉；要改時間，請到案件裡建議改期。</span></section><section style="padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 8px"><h2 style="margin: 0; font-size: 18px; font-weight: 900; color: {{denim}}">這天的案件</h2><sc-for list="{{jobs}}" as="j" hint-placeholder-count="2"><a href="{{j.href}}" style="padding: 12px; border-radius: 12px; background: #F6F3EC; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #23262E"><span style="display: flex; align-items: center; gap: 8px; flex-wrap: nowrap"><strong style="font-size: 17px; color: {{denim}}">{{j.time}}</strong><span style="padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; background: {{j.tagBg}}; color: {{j.tagFg}}">{{j.kind}}</span></span><span style="font-size: 16px; font-weight: 700">{{j.t}}</span><span style="font-size: 14px; color: #4E525C">{{j.b}}</span></a></sc-for><sc-if value="{{noJobs}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; color: #62666F">這天還沒有案件。</span></sc-if></section><section style="padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DDD2; display: flex; flex-direction: column; gap: 8px; gap: 12px"><h2 style="margin: 0; font-size: 18px; font-weight: 900; color: {{denim}}">回覆公開求助</h2><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: nowrap"><span style="font-size: 18px; font-weight: 700">冷氣 · 不冷</span><span style="flex-shrink: 0; font-size: 14px; color: #62666F">3 分鐘前</span></div><span style="font-size: 15px; line-height: 1.6; color: #4E525C">[行政區] · 今天 · 先視訊</span><span style="padding: 10px 12px; border-radius: 12px; background: #F6F3EC; font-size: 15px; line-height: 1.6">「開了一小時都不冷，室外機有在轉。」</span><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><span style="height: 96px; border-radius: 12px; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 14px">[照片 1]</span><span style="height: 96px; border-radius: 12px; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 14px">[照片 2]</span></div><label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">給客戶的話<textarea rows="3" style="font-family: inherit; font-size: 16px; line-height: 1.6; padding: 12px; border: 1px solid #D8D2C4; border-radius: 12px; background: #FFFFFF; color: #23262E; resize: none; font-weight: 400">看照片像是冷媒不足或濾網太髒，視訊 10 分鐘可以幫你判斷。</textarea></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; font-weight: 700">可以視訊的時間<select style="min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #D8D2C4; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #23262E; font-weight: 400"><option>今天 19:00 之後</option></select></label><span style="font-size: 14px; color: #62666F">回覆公開求助不收費。客戶選了你，才會成立預約。</span><a href="TechHome.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 15px; font-weight: 700; border: none; background: {{accent}}; color: #FFFFFF">送出回覆</a></section></div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":390,"height":1930}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 0, open: {} }; }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const st = this.state;
    const W = ['一', '二', '三', '四', '五', '六', '日'];
    const times = []; for (let h = 9; h < 21; h++) { times.push((h < 10 ? '0' : '') + h + ':00'); times.push((h < 10 ? '0' : '') + h + ':30'); }
    const booked = { '0-10': '視訊', '0-14': '到府', '0-15': '到府', '0-20': '視訊', '1-2': '到府', '1-3': '到府', '5-4': '視訊' };
    const base = (d, i) => d < 5 ? (i >= 10 && i <= 21) : (i <= 9);
    const isOpen = (d, i) => { const k = d + '-' + i; return st.open[k] === undefined ? base(d, i) : st.open[k]; };
    const d = st.day;
    const slots = times.map((t, i) => {
      const k = d + '-' + i; const b = booked[k];
      if (b) return { t: t, note: b, on: 'true', border: 'none', bg: denim, fg: '#FFFFFF', weight: '700', pick: () => {} };
      const o = isOpen(d, i);
      return { t: t, note: o ? '可約' : '', on: o ? 'true' : 'false', border: o ? '1.5px solid ' + denim : '1px solid #D8D2C4', bg: o ? '#E4EAF4' : '#FFFFFF', fg: o ? '#26406E' : '#62666F', weight: o ? '700' : '400', pick: () => { const n = Object.assign({}, st.open); n[k] = !o; this.setState({ open: n }); } };
    });
    const setAll = (v) => { const n = Object.assign({}, st.open); times.forEach((t, i) => { if (!booked[d + '-' + i]) n[d + '-' + i] = v; }); this.setState({ open: n }); };
    const jobsAll = { 0: [{ time: '14:00', kind: '已預約視訊', t: '冷氣室內機滴水', b: '林小姐 · [行政區] · 視訊最長 10 分鐘', href: 'TechVideo.dc.html', tagBg: '#E4F0EA', tagFg: '#245443' }, { time: '16:00', kind: '到府 · 已確認', t: '洗衣機不排水', b: '王小姐 · [行政區] · 預計 1 小時', href: 'TechJob.dc.html', tagBg: '#E4EAF4', tagFg: '#26406E' }, { time: '19:00', kind: '已預約視訊', t: '燈具一直閃', b: '陳小姐 · [行政區]', href: 'TechVideo.dc.html', tagBg: '#E4F0EA', tagFg: '#245443' }], 1: [{ time: '10:00', kind: '到府 · 已確認', t: '馬桶一直流水', b: '陳小姐 · [行政區] · 預計 1 小時', href: 'TechJob.dc.html', tagBg: '#E4EAF4', tagFg: '#26406E' }], 5: [{ time: '11:00', kind: '已預約視訊', t: '冷氣異音', b: '張小姐 · [行政區]', href: 'TechVideo.dc.html', tagBg: '#E4F0EA', tagFg: '#245443' }] };
    const jobs = jobsAll[d] || [];
    return {
      accent: this.props.accent ?? '#C8412C', denim: denim,
      days: W.map((w, i) => ({ w: i === 0 ? '今天' : '週' + w, n: '[日]', on: i === d ? 'true' : 'false', border: i === d ? '2px solid ' + denim : '1px solid #D8D2C4', bg: i === d ? '#E4EAF4' : '#FFFFFF', weight: i === d ? '700' : '400', dot: jobsAll[i] ? denim : 'transparent', pick: () => this.setState({ day: i }) })),
      dayTitle: (d === 0 ? '今天' : '週' + W[d]) + '的時段',
      openN: String(slots.filter((s) => s.note === '可約').length),
      slots: slots, allOn: () => setAll(true), allOff: () => setAll(false),
      jobs: jobs, noJobs: jobs.length === 0
    };
  }
}
</script>
