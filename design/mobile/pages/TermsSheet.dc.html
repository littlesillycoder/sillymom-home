<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 條款重點（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- m-fixed -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#F6F3EC;color:#23262E}
a{color:#2F4F86}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}a:hover{color:#26406E}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */



/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: rgba(35,38,46,0.55); font-family: 'Noto Sans TC', sans-serif; color: #23262E">
<a href="SignUp.dc.html" aria-label="關閉" style="flex: 1 1 auto; min-height: 60px; display: block"></a>
<div style="flex-shrink: 0; max-height: 760px; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="padding: 16px 16px 4px; display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap"><span style="font-size: 20px; font-weight: 900">服務條款重點</span><a href="SignUp.dc.html" aria-label="關閉" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #23262E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a></div><span style="font-size: 14px; color: #62666F">每一點都勾選後，才能同意。<a href="Legal.dc.html">看完整條款 →</a></span></div>
<div style="padding: 0 16px; overflow-y: auto; display: flex; flex-direction: column"><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EEEAE1; font-size: 15px; line-height: 1.6; flex-wrap: nowrap"><button type="button" role="checkbox" aria-checked="{{c0}}" aria-label="平台費（求助）NT$100" onClick="{{t0}}" style="width: 24px; height: 24px; margin-top: 1px; flex-shrink: 0; padding: 0; border-radius: 6px; border: {{bd0}}; background: {{bg0}}; display: flex; align-items: center; justify-content: center"><svg data-keep width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button><span><strong>平台費（求助）NT$100</strong><br><span style="color: #4E525C">含 2 次視訊，第 1 次視訊後 24 小時內有效；求助結束才扣款。</span></span></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EEEAE1; font-size: 15px; line-height: 1.6; flex-wrap: nowrap"><button type="button" role="checkbox" aria-checked="{{c1}}" aria-label="視訊全程錄影" onClick="{{t1}}" style="width: 24px; height: 24px; margin-top: 1px; flex-shrink: 0; padding: 0; border-radius: 6px; border: {{bd1}}; background: {{bg1}}; display: flex; align-items: center; justify-content: center"><svg data-keep width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button><span><strong>視訊全程錄影</strong><br><span style="color: #4E525C">只有你和師傅看得到，申訴調閱或依法要求時除外。</span></span></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EEEAE1; font-size: 15px; line-height: 1.6; flex-wrap: nowrap"><button type="button" role="checkbox" aria-checked="{{c2}}" aria-label="出車費和維修費直接付給師傅" onClick="{{t2}}" style="width: 24px; height: 24px; margin-top: 1px; flex-shrink: 0; padding: 0; border-radius: 6px; border: {{bd2}}; background: {{bg2}}; display: flex; align-items: center; justify-content: center"><svg data-keep width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button><span><strong>出車費和維修費直接付給師傅</strong><br><span style="color: #4E525C">師傅在視訊後報價，你同意才開工。</span></span></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EEEAE1; font-size: 15px; line-height: 1.6; flex-wrap: nowrap"><button type="button" role="checkbox" aria-checked="{{c3}}" aria-label="取消和改期規則" onClick="{{t3}}" style="width: 24px; height: 24px; margin-top: 1px; flex-shrink: 0; padding: 0; border-radius: 6px; border: {{bd3}}; background: {{bg3}}; display: flex; align-items: center; justify-content: center"><svg data-keep width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button><span><strong>取消和改期規則</strong><br><span style="color: #4E525C">到府前 12 小時內取消，收逾時費（臨時取消）<strong style="white-space: nowrap">NT$100</strong>；改期收 <strong style="white-space: nowrap">NT$50</strong>。</span></span></div><div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #EEEAE1; font-size: 15px; line-height: 1.6; flex-wrap: nowrap"><button type="button" role="checkbox" aria-checked="{{c4}}" aria-label="隱私政策" onClick="{{t4}}" style="width: 24px; height: 24px; margin-top: 1px; flex-shrink: 0; padding: 0; border-radius: 6px; border: {{bd4}}; background: {{bg4}}; display: flex; align-items: center; justify-content: center"><svg data-keep width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button><span><strong>隱私政策</strong><br><span style="color: #4E525C">預約確認後，師傅才看得到你的詳細地址。</span></span></div></div>
<div data-mbar style="flex-shrink: 0; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px"><sc-if value="{{all}}" hint-placeholder-val="{{ false }}"><a href="SignUp.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 16px; font-weight: 700; border: none; background: {{accent}}; color: #FFFFFF">全部同意，回到上一頁</a></sc-if><sc-if value="{{notAll}}" hint-placeholder-val="{{ true }}"><span style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; text-decoration: none; font-family: inherit; font-size: 16px; font-weight: 700; border: none; background: #E8C2BA; color: #FFFFFF">還有 {{left}} 點沒勾</span></sc-if></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: [true, true, true, false, false] }; }
  renderVals() {
    const c = this.state.c; const left = c.filter((x) => !x).length; const r = { accent: this.props.accent ?? '#C8412C', denim: this.props.denim ?? '#3A5A94', all: left === 0, notAll: left > 0, left: left };
    c.forEach((v, k) => { r['c' + k] = v ? 'true' : 'false'; r['bg' + k] = v ? (this.props.denim ?? '#3A5A94') : '#FFFFFF'; r['bd' + k] = v ? 'none' : '2px solid #8B8F98'; r['t' + k] = () => { const n = c.slice(); n[k] = !n[k]; this.setState({ c: n }); }; });
    return r;
  }
}
</script>
</body>
