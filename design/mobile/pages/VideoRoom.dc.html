<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>傻媽萬事通 視訊室（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- m-fixed -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:"Noto Sans TC",sans-serif;background:#16181D;color:#FFFFFF}
a{color:#A9C1EC}a:hover{color:#C9D8F3}p,li,span,div,a,label,h1,h2,h3,summary,button{text-wrap:pretty}

/* 手機版共用規則（每個畫板在自己的頁面裡顯示，所以不用加前綴）
   1. 一般橫排可換行；開頭是圖示或頭像的橫排，圖示和文字固定同一行，第三個以後的元素換到下一行
   2. 按鈕、標籤、日期這類短文字不斷開；段落裡的連結整段一起換行 */
*{box-sizing:border-box}
[style*="display: flex"]:not([style*="flex-direction: column"]){flex-wrap:wrap}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(2){flex:1 1 180px;min-width:0}
[style*="display: flex"]:not([style*="flex-direction: column"]):is(:has(> svg:first-child),:has(> :first-child:not(button):not(a)[style*="flex-shrink: 0"]),:has(> :first-child:not(button):not(a)[style*="border-radius: 50%"])) > :nth-child(n+3){margin-left:auto}
header,header *,[data-mbar] *{flex-wrap:nowrap!important}
button,a[style*="display: flex"],a[style*="display: inline-flex"],[style*="border-radius: 999px"],[style*="border-radius: 6px"],[role="tab"]{white-space:nowrap}
a:not([style*="display"]){display:inline-block}
img,video{max-width:100%}
/* 10-27：不可以左右滑；打勾一律綠色；勾選框旁的文字不跑到下面；按鈕文字置中、15px、不超出 */
html,body{overflow-x:hidden}
/* 10-27 第 3 輪：格狀排版不把多出的高度分給每一塊（避免內容中間出現空白）；區塊最後的文字連結靠左；區塊標題統一 18px */
[style*="display: grid"]{align-content:start}
[style*="flex-direction: column"] > a:not([style*="display"]):not([style*="align-self"]){align-self:flex-start}
h2{font-size:18px!important;line-height:1.4}
/* 不斷行的文字裡面的小段落也不斷行（text-wrap 規則會讓裡面的 span 自己斷行） */
[style*="white-space: nowrap"] *{white-space:nowrap}
#dc-root > div,x-dc > div{max-width:100%}
svg:not([data-keep]):has(> path[d="M5 12l5 5L20 7"]){stroke:#2E7D5B}
label:has(> input[type="checkbox"]),label:has(> input[type="radio"]){flex-wrap:nowrap!important}
label > input[type="checkbox"],label > input[type="radio"]{flex-shrink:0}
:is(a,button)[style*="min-height: 4"][style*="border-radius: 1"],[data-mbar] :is(a,button){justify-content:center;text-align:center;font-size:15px!important;white-space:nowrap;min-width:0;padding-left:10px!important;padding-right:10px!important}
table{width:100%}
/* 固定在底部的按鈕區：依狀態出現的按鈕一律直排、滿版 */
[data-mrow] > div{flex-direction:column!important;gap:8px!important;flex-wrap:nowrap!important}
[data-mrow] a,[data-mrow] button{width:100%;min-height:48px!important;justify-content:center}

/* 10-28 第 5 輪定案的標準
   按鈕：大 48px（底部固定、頁面主要動作）／中 44px（卡片裡）／小 36px（列表裡），字一律 15px 粗體
   輸入框 44px、字 16px（驗證碼 48px、搜尋 40px）；標籤 14px 粗體、上下 2px、左右 10px
   卡片：開頭或結尾是文字的卡片內距 16px；行距 8px；資料列最後一列下面不留空 */
:is(a,button)[style*="min-height: 52px"],:is(a,button)[style*="min-height: 56px"]{min-height:48px!important;font-size:15px!important}
input:not([type="checkbox"]):not([type="radio"]):not([type="search"]),select{min-height:44px!important;height:44px!important;font-size:16px!important}
input[type="search"]{min-height:40px!important;height:40px!important;font-size:16px!important}
input[style*="text-align: center"][style*="font-size: 24px"],input[style*="text-align: center"][style*="font-weight: 900"]{min-height:48px!important;height:48px!important;font-size:22px!important}
span[style*="border-radius: 999px"]:is([style*="padding: 3px 10px"],[style*="padding: 6px 12px"],[style*="padding: 2px 8px"],[style*="padding: 4px 12px"],[style*="padding: 3px 10px 3px 10px"],[style*="padding: 6px 12px 6px 12px"],[style*="padding: 2px 8px 2px 8px"]):not(header *){padding:2px 10px!important;font-size:14px!important;font-weight:700!important}
[style*="padding: 20px 16px 20px 16px"][style*="border-radius: 2"]:not(section[style*="background: #E4EAF4"]):not([data-keep-pad]){padding:16px!important}
[style*="border-top: 1px solid #ECE7DC"]:last-child{padding-bottom:0!important}
span:empty[style*="border-radius: 999px"],b:empty,span:empty[data-avail]{display:none}
[style*="flex-direction: column"] > a:not([style*="display"]):not([data-back]):not([style*="align-self"]){align-self:flex-end;text-align:right}
a[data-back]{align-self:flex-start}

/* 10-28 第 6 輪：空的狀態標籤不顯示；巢狀的滿版區塊第一塊上面、最後一塊下面不再多留空 */
span:empty[style*="max-width: 96px"]{display:none}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):first-child{padding-top:0!important}
section > section:is([style*="margin: 0 -16px"],[style*="margin: 0px -16px"]):last-child{padding-bottom:0!important}

/* 10-29 第 7 輪：設計稿裡不顯示捲軸（手機的捲軸不佔位置，卡片才會置中） */
html,body,[data-mscroll]{scrollbar-width:none}
::-webkit-scrollbar{display:none}

/* 10-28 第 6 輪：卡片上下動態內距 */
[data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"][data-vt="10"]{padding-top:10px!important}
[data-vt="12"][data-vt="12"][data-vt="12"][data-vt="12"][data-vt="12"][data-vt="12"]{padding-top:12px!important}
[data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"][data-vb="10"]{padding-bottom:10px!important}

/* 11-01：圓角統一：卡片 16、卡片裡的小框 12（圖示、頭像這類固定大小的不改） */
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:16px!important}
:is(div,section,aside,form,details,article,li):is([style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]) :is(div,section,aside,form,details,article,li,label):is([style*="border-radius: 10px"],[style*="border-radius: 14px"],[style*="border-radius: 16px"],[style*="border-radius: 18px"],[style*="border-radius: 20px"],[style*="border-radius: 24px"]):not([style*="; height: "]:not([style*="width: 100%"])){border-radius:12px!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #111317; font-family: 'Noto Sans TC', sans-serif; color: #FFFFFF">
<div style="position: absolute; inset: 0; background: linear-gradient(160deg, #3B4250 0%, #2A2F38 55%, #1C1F25 100%)"></div>
<div style="position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-size: 14px; color: #C9CCD3">{{stageLabel}}</div>
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0"><ellipse cx="200" cy="420" rx="70" ry="48" fill="none" stroke="#F5C542" stroke-width="4"></ellipse><path d="M262 392 L300 350" stroke="#F5C542" stroke-width="4" stroke-linecap="round"></path></svg>
<span style="position: absolute; left: 226px; top: 318px; padding: 4px 10px; border-radius: 8px; background: #F5C542; color: #23262E; font-size: 14px; font-weight: 700">排水管出口在這裡</span>
<div style="position: relative; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0))">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 50%; background: #E5484D"></span>錄影中 · 林師傅</span>
<span style="padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.14); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">08:05 / 10:00</span>
</div>
<span style="align-self: flex-start; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.12); font-size: 13px; color: #E4E6EA">視訊中請勿交換電話或 LINE</span>
</div>
<div style="position: absolute; right: 12px; top: 92px; width: 96px; height: 128px; border-radius: 14px; background: #2C2F37; border: 2px solid rgba(255,255,255,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #E4EAF4; color: #26406E; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900">林</span>
<span style="font-size: 12px; color: #C9CCD3">林師傅</span>
</div>
<span style="position: absolute; left: 16px; top: 520px; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,0.5); font-size: 13px; color: #F5C542">林師傅正在你的畫面上標註</span>
<sc-if value="{{flash}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; right: 16px; top: 520px; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,0.5); font-size: 13px">手電筒已開啟</span></sc-if>
<div style="flex-grow: 1"></div>
<div style="position: relative; padding: 0 12px 8px; display: flex; flex-direction: column; gap: 8px">
<div data-vt="12" style="align-self: flex-start; padding: 10px 12px; border-radius: 12px; background: rgba(253,243,215,0.95); color: #6B4A00; font-size: 14px; line-height: 1.5; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px"><strong style="white-space: nowrap">剩 2 分鐘</strong><span>結束後師傅會給你診斷單和報價。<br>需要更多時間，可以用第 2 次視訊。</span></div>
<button type="button" onClick="{{toggleSteps}}" style="min-height: 48px; padding: 0 14px; border-radius: 12px; border: none; background: rgba(44,58,85,0.95); color: #FFFFFF; font-family: inherit; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; height: 24px; border-radius: 50%; background: {{denim}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">3</span>師傅請你拍：室內機右下角排水口</span><span style="font-size: 13px; color: #C9CCD3">{{stepsLabel}}</span></button>
<sc-if value="{{stepsOpen}}" hint-placeholder-val="{{ false }}"><div style="padding: 8px; border-radius: 12px; background: rgba(28,31,37,0.96); display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4"><div style="padding: 8px 10px; border-radius: 10px; background: {{s.bg}}; display: flex; align-items: center; gap: 10px; font-size: 15px; color: {{s.fg}}; font-weight: {{s.weight}}"><span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; background: {{s.dotBg}}; color: {{s.dotFg}}; display: flex; align-items: center; justify-content: center; font-size: 13px">{{s.n}}</span>{{s.t}}</div></sc-for>
</div></sc-if>
<button data-vt="10" data-vb="10" type="button" onClick="{{toggleChat}}" style="min-height: 44px; padding: 8px 12px; border-radius: 12px; border: none; background: rgba(0,0,0,0.55); color: #FFFFFF; font-family: inherit; font-size: 14px; line-height: 1.5; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span style="flex: 1; min-width: 0">林師傅：看到了，排水口附近有積水，我在畫面上圈起來了。</span><span style="font-size: 13px; color: #C9CCD3">回覆</span></button>
<sc-if value="{{chatOpen}}" hint-placeholder-val="{{ false }}"><div style="padding: 10px; border-radius: 12px; background: rgba(28,31,37,0.96); display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{chat}}" as="m" hint-placeholder-count="3"><div style="align-self: {{m.side}}; max-width: 85%; padding: 8px 12px; border-radius: 12px; background: {{m.bg}}; color: {{m.fg}}; font-size: 14px; line-height: 1.6">{{m.t}}</div></sc-for>
<div style="display: flex; gap: 8px"><input type="text" placeholder="輸入訊息…" aria-label="傳訊息給師傅" style="flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; border: none; background: #2C2F37; color: #FFFFFF; font-family: inherit; font-size: 16px"><button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: none; background: {{denim}}; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">送出</button></div>
</div></sc-if>
</div>
<div style="position: relative; padding: 12px 12px 28px; background: rgba(17,19,23,0.92); display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{controls}}" as="c" hint-placeholder-count="5"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="padding: 0; border: none; background: transparent; font-family: inherit; color: #E4E6EA; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 52px; height: 52px; border-radius: 50%; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg></span>{{c.t}}</button></sc-for>
</div>
<a href="Summary.dc.html" style="min-height: 52px; border-radius: 12px; background: #B42318; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15c5-5 13-5 18 0l-3 3-3-2v-3a12 12 0 00-6 0v3l-3 2z"></path></svg>結束諮詢</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8412C","options":["#C8412C","#D9573B","#B5362A","#E0663F"]},"denim":{"editor":"color","default":"#3A5A94","options":["#3A5A94","#4A6BA8","#2F4F86","#26406E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mic: true, cam: true, rear: true, flash: true, steps: false, chatOpen: false };
  }
  renderVals() {
    const denim = this.props.denim ?? '#3A5A94';
    const st = this.state;
    const btn = (on, d, t, key) => ({
      d: d,
      t: t,
      pressed: on ? 'true' : 'false',
      bg: on ? '#2C2F37' : '#F5F5F5',
      fg: on ? '#FFFFFF' : '#23262E',
      pick: () => this.setState({ [key]: !st[key] })
    });
    const rearBtn = {
      d: 'M4 8h3l2-3h6l2 3h3v11H4zM9 13a3 3 0 006 0M15 13a3 3 0 00-6 0M8 11l1 2 2-1M16 15l-1-2-2 1',
      t: st.rear ? '後鏡頭' : '前鏡頭',
      pressed: st.rear ? 'true' : 'false',
      bg: '#2C2F37',
      fg: '#FFFFFF',
      pick: () => this.setState({ rear: !st.rear })
    };
    const flashBtn = {
      d: 'M13 2L5 14h6l-1 8 8-12h-6z',
      t: st.flash ? '手電筒 開' : '手電筒',
      pressed: st.flash ? 'true' : 'false',
      bg: st.flash ? '#F5C542' : '#2C2F37',
      fg: st.flash ? '#23262E' : '#FFFFFF',
      pick: () => this.setState({ flash: !st.flash })
    };
    return {
      stepsOpen: !!st.steps, toggleSteps: () => this.setState({ steps: !st.steps }), stepsLabel: st.steps ? '收起' : '全部 4 項', chatOpen: !!st.chatOpen, toggleChat: () => this.setState({ chatOpen: !st.chatOpen }),
      accent: this.props.accent ?? '#C8412C',
      denim: denim,
      flash: st.flash,
      stageLabel: st.rear ? '[你的後鏡頭畫面：冷氣室內機右下角]' : '[你的前鏡頭畫面]',
      controls: [
        btn(st.mic, 'M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3', st.mic ? '麥克風' : '已靜音', 'mic'),
        btn(st.cam, 'M3 6h12v12H3zM15 10l6-3v10l-6-3z', st.cam ? '鏡頭' : '鏡頭已關', 'cam'),
        rearBtn,
        flashBtn,
        { d: 'M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M12 9a3 3 0 110 6 3 3 0 010-6', t: '截圖存證', pressed: 'false', bg: '#2C2F37', fg: '#FFFFFF', pick: () => {} }
      ],
      steps: [
        { n: '1', t: '室內機正面', bg: 'transparent', fg: '#A8ABB3', dotBg: '#1F4A36', dotFg: '#5FD39A', weight: '400' },
        { n: '2', t: '遙控器顯示的畫面', bg: 'transparent', fg: '#A8ABB3', dotBg: '#1F4A36', dotFg: '#5FD39A', weight: '400' },
        { n: '3', t: '室內機右下角排水口', bg: '#2C3A55', fg: '#FFFFFF', dotBg: denim, dotFg: '#FFFFFF', weight: '700' },
        { n: '4', t: '室外機與排水管', bg: 'transparent', fg: '#D5D7DC', dotBg: '#2C2F37', dotFg: '#D5D7DC', weight: '400' }
      ],
      chat: [
        { t: '請把鏡頭靠近室內機右下角，我幫你看排水管。', side: 'flex-start', bg: '#2C2F37', fg: '#FFFFFF' },
        { t: '這樣看得到嗎？', side: 'flex-end', bg: denim, fg: '#FFFFFF' },
        { t: '看到了，排水口附近有積水，我在畫面上圈起來了。再請你拍一下室外機。', side: 'flex-start', bg: '#2C2F37', fg: '#FFFFFF' }
      ]
    };
  }
}
</script>
</body>
</html>
